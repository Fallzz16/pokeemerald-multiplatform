name: Grand World M8 - Paired Performance Build
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-m8-performance-build.yml'
      - 'tools/grandworld/optimize_overworld_budget.py'
      - 'tools/grandworld/apply_grass_only.py'
      - 'tools/grandworld/tests/test_optimize_overworld_budget.py'
      - 'tools/grandworld/audit_lz77_resources.py'
      - 'tools/grandworld/tests/test_audit_lz77_resources.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-m8-perf-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout experimental patch branch
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned upstream World
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
          fetch-depth: 0
      - name: Install GBA build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
      - name: Apply M8 integration and experimental sprite profile
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --report m8-perf-profile.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report postm8-grass-only.json
          git -C world diff --check
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p 'test_*.py'
      - name: Compile baseline -O2 without LTO
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 2>&1 | tee m8-perf-o2.log
          test -s world/pokemonworld.gba
      - name: Compile release with link-time optimization
        shell: bash
        run: |
          set -euo pipefail
          make -C world release -j2 2>&1 | tee m8-perf-lto.log
          test -s world/pokemonworld-release.gba
      - name: Validate headers and compare per-section build memory
        run: |
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          limits = {'ROM':33554432, 'EWRAM':262144, 'IWRAM':32768}
          variants = {}
          for label, rom, log in (
              ('o2', Path('world/pokemonworld.gba'), Path('m8-perf-o2.log')),
              ('lto_release', Path('world/pokemonworld-release.gba'), Path('m8-perf-lto.log'))):
              data = rom.read_bytes()
              assert len(data) == 33554432, (label, len(data))
              assert data[0xAC:0xB0] == b'BPEE' and data[0xB2] == 0x96, label
              assert (sum(data[0xA0:0xBD]) + data[0xBD] + 0x19) % 256 == 0, label
              matches = re.findall(r'(?m)^\s*(ROM|EWRAM|IWRAM):\s+(\d+) B\s+',log.read_text())
              values = {name:int(v) for name,v in matches[-3:]}
              assert set(values) == set(limits), (label, values)
              assert all(0 < values[k] <= limits[k] for k in limits), (label, values)
              variants[label] = {'sha256':hashlib.sha256(data).hexdigest(), 'linker_bytes':values}
          delta = {k:variants['lto_release']['linker_bytes'][k] - variants['o2']['linker_bytes'][k] for k in limits}
          out = {'comparability':'same pinned World and patch set; release also defines NDEBUG/RELEASE, so not identical functionality',
                 'variants':variants,'release_minus_o2_bytes':delta,
                 'measured_fps':None,'emulator_acceptance_for_lto':False,'rom_artifacts_uploaded':False}
          Path('m8-perf-memory-comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Enforce native cartridge and linker headroom for both builds
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/evaluate_performance_budget.py world/pokemonworld.gba m8-perf-o2.log --output m8-o2-hardware-budget.json
          python3 grandworld/tools/grandworld/evaluate_performance_budget.py world/pokemonworld-release.gba m8-perf-lto.log --output m8-release-hardware-budget.json
      - name: Audit pointer-referenced LZ77 assets (read only; no FPS claims)
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/audit_lz77_resources.py world/pokemonworld.gba --compare world/pokemonworld-release.gba --output m8-perf-lz77-comparison.json
          test -s m8-perf-lz77-comparison.json
      - name: Upload measurement logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRANDWORLD_M8_PERFORMANCE_MEASUREMENTS
          path: |
            m8-perf-profile.json
            m8-perf-o2.log
            m8-perf-lto.log
            m8-perf-memory-comparison.json
            m8-perf-lz77-comparison.json
            m8-o2-hardware-budget.json
            m8-release-hardware-budget.json
          if-no-files-found: warn
