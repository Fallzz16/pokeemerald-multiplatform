name: Grand World Native - Experimental P0/P1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/grandworld_native/**'
      - '.github/workflows/grandworld-native-experimental.yml'
      - 'tools/grandworld/**'

permissions:
  contents: read

jobs:
  native-source-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout experimental Grand World adapters
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned World source (disposable)
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test P0 composer and safe data-pack validator
        run: |
          set -euo pipefail
          python3 -m compileall -q grandworld/tools/grandworld_native
          cd grandworld
          python3 -m unittest discover -s tools/grandworld_native/tests -p 'test_*.py' -v
          cd ..
      - name: Install build and native probe prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev libsdl2-dev
      - name: P0 - materialize full M8 + PT-BR in isolated World tree
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld_native/compose.py \
            --world world --grandworld grandworld --apply --report native-compose-report.json \
            2>&1 | tee native-compose.log
          git -C world diff --check
      - name: P0 - verify GBA reference still builds and validates
        run: |
          set -euo pipefail
          make -C world modern -j2 2>&1 | tee native-baseline-gba.log
          test -s world/pokemonworld.gba
          make -C world validate 2>&1 | tee native-baseline-validate.log
      - name: P1 - record real C portability compiler diagnostics
        if: always()
        run: |
          python3 grandworld/tools/grandworld_native/probe.py \
            --world world --grandworld grandworld --compiler gcc \
            --output native-portability-probe.json
      - name: Upload diagnostics (no ROM or commercial resources)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grandworld-native-p0-p1-diagnostics
          path: |
            native-compose-report.json
            native-compose.log
            native-baseline-gba.log
            native-baseline-validate.log
            native-portability-probe.json
          if-no-files-found: warn

  host-sdl2-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install C compiler and SDL2 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev
      - name: Compile real C/SDL2 host and test synthetic frame
        run: |
          set -euo pipefail
          cmake -S tools/grandworld_native/host -B build/native-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-host -j2
          ctest --test-dir build/native-host --output-on-failure

  native-header-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout adapters
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned World source
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
      - name: Compile portable sources against World headers (diagnostic only)
        run: |
          python3 grandworld/tools/grandworld_native/probe.py \
            --world world --grandworld grandworld \
            --output native-header-probe.json
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grandworld-native-header-probe
          path: native-header-probe.json

  windows-host-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
      - name: Build Windows native SDL2 host diagnostic (not Grand World gameplay)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S tools/grandworld_native/host -B build/native-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-win -j2
          test -f build/native-win/gw_host_preview.exe
          cp /mingw64/bin/SDL2.dll build/native-win/SDL2.dll
          export SDL_VIDEODRIVER=dummy
          ./build/native-win/gw_host_smoke.exe
      - name: Upload Windows SDL2 host diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: grandworld-native-sdl2-host-windows-diagnostic-NOT-GAME
          path: |
            build/native-win/gw_host_preview.exe
            build/native-win/SDL2.dll
          if-no-files-found: error
