name: Grand World M8 - Grass and Adaptive Shadow Experiment
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-m8-grass-adaptive.yml'
      - 'tools/grandworld/apply_quetzal_profile.py'
      - 'tools/grandworld/tests/test_apply_quetzal_profile.py'
      - 'docs/GRANDWORLD_M8_ADAPTIVE_PROFILE_QA_PTBR.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m8-grass-adaptive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  experimental-rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout experimental profile
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned source without changing upstream
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
          fetch-depth: 0
      - name: Install modern GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
      - name: Run exact patch tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p 'test_apply_quetzal_profile.py' -v
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p 'test_audit_lz77_resources.py' -v
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p 'test_optimize_overworld_budget.py' -v
      - name: Integrate Grand World then apply the opt-in profile
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --report m8-pr70-profile.json
          python3 grandworld/tools/grandworld/apply_quetzal_profile.py world --report m8-preflight.json
          python3 grandworld/tools/grandworld/apply_quetzal_profile.py world --apply --report m8-grass-adaptive-profile.json
          grep -Eq '^#define WE_VANILLA_RANDOM[[:space:]]+TRUE([[:space:]]|$)' world/include/config/wild_encounter.h
          grep -Eq '^#define WE_OW_ENCOUNTERS[[:space:]]+FALSE([[:space:]]|$)' world/include/config/wild_encounter.h
          grep -Eq '^#define OW_OBJECT_VANILLA_SHADOWS[[:space:]]+FALSE([[:space:]]|$)' world/include/config/overworld.h
          grep -Eq '^#define OW_GFX_COMPRESS[[:space:]]+FALSE([[:space:]]|$)' world/include/config/overworld.h
          git -C world diff --check
      - name: Build modern GBA cartridge
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 2>&1 | tee m8-profile-build.log
          test -s world/pokemonworld.gba
      - name: Validate maps and linker memory without touching saves
        shell: bash
        run: |
          set -euo pipefail
          make -C world validate 2>&1 | tee m8-profile-validate.log
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          rom=Path("world/pokemonworld.gba").read_bytes()
          assert len(rom)==33554432
          assert rom[0xAC:0xB0]==b"BPEE" and rom[0xB2]==0x96
          assert (sum(rom[0xA0:0xBD])+rom[0xBD]+0x19)%256==0
          found=re.findall(r'(?m)^\s*(ROM|EWRAM|IWRAM):\s+(\d+) B\s+', Path("m8-profile-build.log").read_text())
          mem={k:int(n) for k,n in found[-3:]}
          assert set(mem)=={"ROM","EWRAM","IWRAM"},mem
          assert 0<mem["ROM"]<=33554432 and 0<mem["EWRAM"]<=262144 and 0<mem["IWRAM"]<=32768,mem
          result={"rom_sha256":hashlib.sha256(rom).hexdigest(),"rom_size":len(rom),
                  "linker_memory":mem,"fps_measured":False,"gameplay_homologated":False,
                  "saves_modified":False,"shadow_visual_qa":False}
          Path("m8-grass-adaptive-memory.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
          python3 grandworld/tools/grandworld/audit_lz77_resources.py world/pokemonworld.gba --output m8-grass-lz77.json
      - name: Build pinned mGBA headless test engine
        run: |
          set -euo pipefail
          sudo apt-get install -y cmake liblua5.4-dev libpng-dev zlib1g-dev
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF \
            -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
          test -x mgba/build/mgba-headless
      - name: Execute fresh cartridge title and boot tests in mGBA
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/SmokeBoot.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/m8-profile-smoke.log"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/WorldTitle.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/m8-profile-title.log"
          test -s _pwtest/SmokeBoot.PASS
          test -s _pwtest/WorldTitle.PASS
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS [1-9][0-9]*/[1-9][0-9]* rom=$md5 .* suite=SmokeBoot$" _pwtest/SmokeBoot.PASS
          grep -Eq "^PASS [1-9][0-9]*/[1-9][0-9]* rom=$md5 .* suite=WorldTitle$" _pwtest/WorldTitle.PASS
          if test -s _pwtest/SmokeBoot.FAIL || test -s _pwtest/WorldTitle.FAIL; then
            echo "mGBA conflicting verdict" >&2
            exit 1
          fi
      - name: Verify same-ROM protagonist party save and Continue
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/extend_story_save_qa.py \
            world/test/overworld/lua/StoryProgress.lua \
            world/test/overworld/lua/GrandWorldHeroSave.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=360 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldHeroSave.lua "$PWD/pokemonworld.gba" \
            | tee "$GITHUB_WORKSPACE/m8-profile-hero-save.log"
          test -s _pwtest/GrandWorldHeroSave.PASS
          test ! -e _pwtest/GrandWorldHeroSave.FAIL
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS 37/37 rom=$md5 .* suite=GrandWorldHeroSave$" _pwtest/GrandWorldHeroSave.PASS
      - name: Advisory cross-region save regression (not release homologation)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/extend_cross_region_save_qa.py \
            world/test/overworld/lua/GrandWorldSixRoutes.lua \
            world/test/overworld/lua/GrandWorldCrossRegionSave.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=480 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldCrossRegionSave.lua "$PWD/pokemonworld.gba" \
            | tee "$GITHUB_WORKSPACE/m8-profile-cross-region-save.log"
          test -s _pwtest/GrandWorldCrossRegionSave.PASS
          test ! -e _pwtest/GrandWorldCrossRegionSave.FAIL
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS 176/176 rom=$md5 .* suite=GrandWorldCrossRegionSave$" _pwtest/GrandWorldCrossRegionSave.PASS
      - name: Upload diagnostics, never game ROM or saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRANDWORLD_M8_GRASS_ADAPTIVE_DIAGNOSTICS
          if-no-files-found: warn
          path: |
            m8-profile-build.log
            m8-profile-validate.log
            m8-profile-smoke.log
            m8-profile-title.log
            m8-profile-hero-save.log
            m8-profile-cross-region-save.log
            m8-grass-lz77.json
            m8-grass-adaptive-memory.json
            m8-grass-adaptive-profile.json
            m8-preflight.json
            m8-pr70-profile.json
