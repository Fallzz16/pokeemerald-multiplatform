name: Emerald M2.3-A Server-First Lobby QA
on:
  push:
    branches:
      - feature/emerald-v100-m23a-server-first-lab
    paths:
      - 'tools/emerald_qa_lab.py'
      - 'tools/emerald_qa_lobby.py'
      - 'tests/test_ehl8_m23a_server_first.py'
      - '.github/workflows/test-v100-m23a-server-first.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and check server-only lifecycle
        run: |
          python -m py_compile tools/emerald_qa_lab.py tools/emerald_qa_lobby.py
          python -m unittest discover -s tests -p test_ehl8_m23a_server_first.py -v
          python -m unittest discover -s tests -p test_emerald_qa_lab.py -v
          python -m unittest discover -s tests -p test_emerald_qa_lobby.py -v
          python -m unittest discover -s tests -p test_ehl8_m23_host_start.py -v
          python -m unittest discover -s tests -p test_ehl8_m23_bundle_safety.py -v
