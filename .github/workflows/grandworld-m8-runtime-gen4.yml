name: Grand World M8 - Fast Runtime and Gen4 Trial
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-m8-runtime-gen4.yml'
      - 'tools/grandworld/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-m8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  integration:
    name: GBA World integrated ROM and measurable Pokedex expansion
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned Pokemon World
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install modern GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
      - name: Apply fail-closed regional travel and trainer scaling
        run: |
          python3 grandworld/tools/grandworld/integrate_world.py world
          test -f world/src/grandworld_balance.c
          test -f world/include/grandworld_balance.h
          git -C world diff --check
      - name: Audit all 24 gym badge and three championship source paths
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/audit_campaign_scripts.py world m8-campaign-source-audit.json
          test -s m8-campaign-source-audit.json
      - name: Enable and place 31 Gen4 plus 12 experimental Gen5 families
        run: |
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          test -s m8-gen4-encounters-evidence.json
          git -C world diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('m8-gen4-encounters-evidence.json').read_text())
          assert o['validator_disabled_floor']==288 and o['family_count']==43 and o['gen4_family_count']==31 and o['gen5_trial_family_count']==12 and o['experimental_gen5_enabled'] is True and o['table_variants_modified']>=43
          Path('m8-expanded-families.txt').write_text('\n'.join(sorted(x['new'] for x in o['changes']))+'\n')
          print('New encounter table entries:',o['table_variants_modified'])
          PY
      - name: Install six hero profiles in actual game introduction
        run: |
          python3 -m py_compile grandworld/tools/grandworld/add_hero_profiles.py grandworld/tools/grandworld/add_kanto_avatar.py grandworld/tools/grandworld/expand_gen4_pilot.py
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 - <<'PY'
          from pathlib import Path
          s=Path('world/src/oak_speech.c').read_text()
          n=Path('world/src/new_game.c').read_text()
          assert 'sHeroMale[3]' in s and 'sHeroFemale[3]' in s
          assert 'VarSet(VAR_PLAYER_CHARACTER, GrandWorldHeroSlot(input))' in s
          assert 'VarSet(VAR_PLAYER_CHARACTER, playerHero)' in n
          assert 'OBJ_EVENT_GFX_RED_NORMAL' in Path('world/src/field_player_avatar.c').read_text()
          assert 'OBJ_EVENT_GFX_GREEN_NORMAL' in Path('world/src/field_player_avatar.c').read_text()
          PY
          git -C world diff --check
      - name: Apply opt-in overworld sprite and encounter CPU budget
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --report m8-performance-optimizations.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report postm8-grass-only.json
          test -s postm8-grass-only.json
          grep -Eq '^#define GW_GRASS_ONLY_WILD[[:space:]]+TRUE' world/include/config/wild_encounter.h
          grep -Eq '^#define WE_OW_ENCOUNTERS[[:space:]]+FALSE' world/include/config/wild_encounter.h
          test -s m8-performance-optimizations.json
          grep -Eq '^#define OW_OBJECT_VANILLA_SHADOWS[[:space:]]+TRUE([[:space:]]|$)' world/include/config/overworld.h
          git -C world diff --check
      - name: Compile ROM with region integration and extra families
        shell: bash
        run: |
          set -o pipefail
          make -C world modern -j2 2>&1 | tee patched-gen4-build.log
      - name: Validate maps, scripts and obtainable species
        shell: bash
        run: |
          set -o pipefail
          make -C world validate 2>&1 | tee patched-gen4-validate.log
      - name: ROM integrity and memory evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          b=Path('world/pokemonworld.gba').read_bytes()
          assert len(b)==33554432,len(b)
          assert b[0xac:0xb0]==b'BPEE'
          assert b[0xb2]==0x96
          assert (sum(b[0xa0:0xbd])+0x19+b[0xbd])%256==0
          log=Path('patched-gen4-build.log').read_text()
          m=re.findall(r'(?m)^\s*(EWRAM|IWRAM|ROM):\s+([0-9]+) B\s+',log)
          if len(m)<3:raise RuntimeError('linker memory readout missing')
          mem={k:int(v) for k,v in m[-3:]}
          assert mem['ROM'] < 33554432 and mem['EWRAM']<=262144 and mem['IWRAM']<=32768,mem
          o={'sha':hashlib.sha256(b).hexdigest(),'rom_size':len(b),'memory':mem,'families_enabled':sorted(set(Path('m8-expanded-families.txt').read_text().splitlines())),'source_sha':__import__('subprocess').check_output(['git','-C','world','rev-parse','HEAD'],text=True).strip(),'gameplay_verified':False}
          Path('m8-integrated-gen4-evidence.json').write_text(json.dumps(o,indent=2))
          print(json.dumps(o,indent=2))
          PY
      - name: Build deterministic headless mGBA test harness
        run: |
          sudo apt-get install -y cmake liblua5.4-dev libpng-dev zlib1g-dev
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF \
            -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
          test -x mgba/build/mgba-headless
      - name: Mandatory new-game and title screens (fresh ROM hash)
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/SmokeBoot.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/m8-smoke-boot.log"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/WorldTitle.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/m8-smoke-title.log"
          test -s _pwtest/SmokeBoot.PASS
          test -s _pwtest/WorldTitle.PASS
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS [1-9][0-9]*/[1-9][0-9]* rom=$md5 .* suite=SmokeBoot$" _pwtest/SmokeBoot.PASS
          grep -Eq "^PASS [1-9][0-9]*/[1-9][0-9]* rom=$md5 .* suite=WorldTitle$" _pwtest/WorldTitle.PASS
          if test -s _pwtest/SmokeBoot.FAIL || test -s _pwtest/WorldTitle.FAIL; then
            echo 'Conflicting emulator verdict found' >&2
            exit 1
          fi
      - name: Certify only ROM-bound acceptance cases (3 of 105)
        run: |
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p 'test_*.py' -v
          python3 -m py_compile grandworld/tools/grandworld/qa_acceptance.py
          python3 grandworld/tools/grandworld/qa_acceptance.py world m8-acceptance-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("m8-acceptance-evidence.json").read_text())
          assert a["total"] == 105 and a["verified"] == 3 and a["pending"] == 102
          assert a["release_approved"] is False
          PY
      - name: Mandatory Wally and Kanto CatchTutorial regression (same ROM)
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/fix_catch_tutorial_input.py world/test/overworld/lua/CatchTutorial.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/CatchTutorial.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/m8-catch-tutorial.log"
          test -s _pwtest/CatchTutorial.PASS
          test ! -e _pwtest/CatchTutorial.FAIL
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS 15/15 rom=$md5 .* suite=CatchTutorial$" _pwtest/CatchTutorial.PASS
      - name: Regional introductory tour and cross-region story QA (advisory)
        continue-on-error: true
        shell: bash
        run: |
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=180 test/overworld/mgba-run.sh test/overworld/lua/HubIntroTour.lua "$PWD/pokemonworld.gba" > "$GITHUB_WORKSPACE/m8-hub-tour.log" 2>&1
          PW_TIMEOUT=180 test/overworld/mgba-run.sh test/overworld/lua/HubPassReCross.lua "$PWD/pokemonworld.gba" > "$GITHUB_WORKSPACE/m8-hub-recross.log" 2>&1
      - name: Catch tutorial regression diagnosis on actual ROM
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          for n in 1 2 3; do
            mkdir -p "$GITHUB_WORKSPACE/m8-catch-$n"
            PW_OUT="$GITHUB_WORKSPACE/m8-catch-$n/" PW_TIMEOUT=180 \
              test/overworld/mgba-run.sh test/overworld/lua/CatchTutorial.lua "$PWD/pokemonworld.gba" \
              > "$GITHUB_WORKSPACE/m8-catch-$n.log" 2>&1
            rc=$?
            echo "CatchTutorial attempt $n exit=$rc"
            grep -E '(VERDICT|\\[FAIL\\]|FAIL|catch tutorial battle)' "$GITHUB_WORKSPACE/m8-catch-$n.log" | tail -18 || true
          done
      - name: Real Hoenn hub party and hero continuity in mGBA (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/extend_hub_party_qa.py \
            world/test/overworld/lua/HubPassReCross.lua \
            world/test/overworld/lua/GrandWorldHubParty.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=360 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldHubParty.lua "$PWD/pokemonworld.gba" \
            | tee "$GITHUB_WORKSPACE/m8-party-hub-gates.log"
          test -s _pwtest/GrandWorldHubParty.PASS
          test ! -e _pwtest/GrandWorldHubParty.FAIL
      - name: Six real directed Kanto-Johto-Hoenn gate transfers with shared team (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/extend_six_routes_qa.py \
            world/test/overworld/lua/GrandWorldHubParty.lua \
            world/test/overworld/lua/GrandWorldSixRoutes.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=450 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldSixRoutes.lua "$PWD/pokemonworld.gba" \
            | tee "$GITHUB_WORKSPACE/m8-six-region-directions.log"
          test -s _pwtest/GrandWorldSixRoutes.PASS
          test ! -e _pwtest/GrandWorldSixRoutes.FAIL
      - name: Actual cartridge save reboot and Continue preserves party and hero (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/extend_story_save_qa.py \
            world/test/overworld/lua/StoryProgress.lua \
            world/test/overworld/lua/GrandWorldHeroSave.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=300 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldHeroSave.lua "$PWD/pokemonworld.gba" \
            | tee "$GITHUB_WORKSPACE/m8-hero-party-save-continue.log"
          test -s _pwtest/GrandWorldHeroSave.PASS
          test ! -e _pwtest/GrandWorldHeroSave.FAIL
      - name: Six protagonist identities survive real game saves and reboots (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/generate_hero_save_matrix.py \
            world/test/overworld/lua/GrandWorldHeroSave.lua \
            world/test/overworld/lua/
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          for hero in Brendan May Red Leaf Ethan Lyra; do
            PW_TIMEOUT=240 test/overworld/mgba-run.sh \
              "test/overworld/lua/GrandWorldSave${hero}.lua" "$PWD/pokemonworld.gba" \
              | tee "$GITHUB_WORKSPACE/m8-save-${hero}.log"
            test -s "_pwtest/GrandWorldSave${hero}.PASS"
            test ! -e "_pwtest/GrandWorldSave${hero}.FAIL"
            grep -Eq "^PASS 38/38 rom=$md5 .* suite=GrandWorldSave${hero}$" \
              "_pwtest/GrandWorldSave${hero}.PASS"
          done
      - name: Verify actual Johto-to-Kanto ship crossing on integrated ROM (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=300 test/overworld/mgba-run.sh \
            test/overworld/lua/SSAquaKantoCrossing.lua "$PWD/pokemonworld.gba" \
            | tee "$GITHUB_WORKSPACE/m8-johto-kanto-travel.log"
          test -s _pwtest/SSAquaKantoCrossing.PASS
          test ! -e _pwtest/SSAquaKantoCrossing.FAIL
      - name: Run all 51 World overworld suites (mandatory and ROM-bound)
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          timeout --signal=TERM --kill-after=10s 420s env PW_TIMEOUT=75 test/overworld/run-all.sh "$PWD/pokemonworld.gba" > "$GITHUB_WORKSPACE/m8-world-suites.log" 2>&1
          grep -q 'green 51 / 51 expected' "$GITHUB_WORKSPACE/m8-world-suites.log"
          grep -q 'SWEEP OK - every expected suite produced a fresh PASS stamped rom=' "$GITHUB_WORKSPACE/m8-world-suites.log"
      - name: Re-run same-ROM release proof suites after run-all clears stamps
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          for pair in GrandWorldHubParty:94 GrandWorldSixRoutes:167 GrandWorldHeroSave:37 SSAquaKantoCrossing:94; do
            suite=${pair%%:*}
            count=${pair##*:}
            script="test/overworld/lua/${suite}.lua"
            test -s "$script"
            PW_TIMEOUT=360 test/overworld/mgba-run.sh "$script" "$PWD/pokemonworld.gba" \
              | tee "$GITHUB_WORKSPACE/m8-final-${suite}.log"
            test -s "_pwtest/${suite}.PASS"
            test ! -e "_pwtest/${suite}.FAIL"
            grep -Eq "^PASS ${count}/${count} rom=$md5 .* suite=${suite}$" "_pwtest/${suite}.PASS"
          done
      - name: Probe actual cross-region party save and Continue after all six gates (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/extend_cross_region_save_qa.py \
            world/test/overworld/lua/GrandWorldSixRoutes.lua \
            world/test/overworld/lua/GrandWorldCrossRegionSave.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=480 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldCrossRegionSave.lua "$PWD/pokemonworld.gba" \
            | tee "$GITHUB_WORKSPACE/m8-real-cross-region-save.log"
          test -s _pwtest/GrandWorldCrossRegionSave.PASS
          test ! -e _pwtest/GrandWorldCrossRegionSave.FAIL
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS 176/176 rom=$md5 .* suite=GrandWorldCrossRegionSave$" \
            _pwtest/GrandWorldCrossRegionSave.PASS
      - name: Finalize ROM-specific acceptance evidence after gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/qa_acceptance.py world m8-acceptance-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("m8-acceptance-evidence.json").read_text())
          assert a["total"]==105
          assert 14<=a["verified"]<=15, a["verified"]
          assert a["pending"]==105-a["verified"], a["pending"]
          assert a["verified"]+a["pending"]==105
          assert a["release_approved"] is False
          verified=[case for case,data in a["cases"].items() if data["status"]=="verified"]
          pending=[case for case,data in a["cases"].items() if data["status"]!="verified"]
          doc=["# Grand World M8 — ROM-bound release acceptance",
               "",
               f"ROM SHA256: `{a['rom_sha256']}`",
               f"ROM MD5: `{a['rom_md5']}`",
               f"Verified: **{len(verified)}/105**",
               f"Pending: **{len(pending)}/105**",
               "Release approved: **NO**",
               "",
               "## Verified criteria",*("- "+n for n in verified),
               "","## Pending — not approved",*("- "+n for n in pending)]
          Path("m8-release-checklist.md").write_text("\n".join(doc)+"\n")
          print("Final acceptance report:",len(verified),"verified",len(pending),"pending")
          PY
      - name: Measure actual hardware OAM occupancy in mGBA (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cp grandworld/tools/grandworld/lua/GrandWorldOamBudget.lua world/test/overworld/lua/GrandWorldOamBudget.lua
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/GrandWorldOamBudget.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/m8-oam-hardware.log"
          test -s _pwtest/GrandWorldOamBudget.PASS
          test ! -e _pwtest/GrandWorldOamBudget.FAIL
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS [1-9][0-9]*/[1-9][0-9]* rom=$md5 .* suite=GrandWorldOamBudget$" _pwtest/GrandWorldOamBudget.PASS
          cd ..
          python3 grandworld/tools/grandworld/parse_oam_metrics.py m8-oam-hardware.log world/pokemonworld.gba --output m8-oam-hardware.json
      - name: Upload logs and measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRANDWORLD_M8_INTEGRATED_GEN4_LOGS
          path: |
            m8-catch-*.log
            m8-world-suites.log
            m8-final-*.log
            m8-smoke-boot.log
            m8-smoke-title.log
            m8-acceptance-evidence.json
            m8-hub-tour.log
            m8-hub-recross.log
            m8-party-hub-gates.log
            m8-six-region-directions.log
            m8-real-cross-region-save.log
            m8-hero-party-save-continue.log
            m8-johto-kanto-travel.log
            m8-save-*.log
            m8-release-checklist.md
            m8-catch-tutorial.log
            m8-catch-tutorial.FAIL
            patched-gen4-build.log
            patched-gen4-validate.log
            m8-integrated-gen4-evidence.json
            m8-expanded-families.txt
            m8-gen4-encounters-evidence.json
            m8-campaign-source-audit.json
            m8-performance-optimizations.json
            postm8-grass-only.json
            m8-oam-hardware.log
            m8-oam-hardware.json
            grandworld/tools/grandworld/*.py
            grandworld/tools/grandworld/*.c
            grandworld/tools/grandworld/*.h
          if-no-files-found: warn
