name: Emerald Hybrid LAN Android candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lan-hybrid-v070
    paths-ignore:
      - '**/*.md'

jobs:
  android-armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout game code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pinned SDL2 source (missing gitlink in Hybrid branch)
        run: |
          test ! -e android/SDL2
          git clone --depth 1 --branch release-2.30.7 https://github.com/libsdl-org/SDL.git android/SDL2
          test -f android/SDL2/android-project/gradlew

      - name: Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner's preinstalled Android SDK command line tools
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install Android platforms NDK CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Install source generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev zlib1g-dev

      - name: Generate Emerald source assets and tools
        run: |
          make -f make_tools.mk -j2
          make -f Makefile_pc -j2 generated
          python3 scripts/prepare_android_assets.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          tracks = sorted(str(p.with_suffix('.s')) for p in Path('sound/songs/midi').glob('*.mid'))
          assert tracks, "No MIDI songs found in Emerald source"
          subprocess.run(['make', '-f', 'Makefile_pc', '-j6', *tracks], check=True)
          print('Prepared', len(tracks), 'MIDI assembly tracks')
          PY
          grep -n 'gMapGroups' data/maps/groups.inc | head -n 3

      - name: Build experimental LAN APK
        run: |
          chmod +x android/SDL2/android-project/gradlew
          android/SDL2/android-project/gradlew -p android :app:assembleDebug --stacktrace --no-daemon
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Diagnose generated ARM symbols after linker failure
        if: failure()
        run: |
          find android/app/.cxx -name 'game_data.o' -print -exec sh -c 'arm-none-eabi-nm -g "$1" | grep -E "gMapGroups|mus_dummy|se_use_item" || true' sh {} \;
          find android/app/.cxx -name '*maps.s.o' -print -exec sh -c 'echo MAPS_OBJ_SYMBOLS; arm-none-eabi-nm -a "$1" | grep -E "gMapGroups|gMapGroup|gMapHeader" | head -n 12 || true' sh {} \;
          find android/app/.cxx -name 'maps.s.o.s' -print -exec sh -c 'echo MAPS_GENERATED_REFERENCES; grep -nE "gMapGroups|groups.inc|gMapGroup" "$1" | head -n 12 || true' sh {} \;
          sed -n '586,600p' data/maps/groups.inc

      - name: Upload unsigned-development APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Hybrid-LAN-v0.7.0-Android-armv7-Experimental
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
