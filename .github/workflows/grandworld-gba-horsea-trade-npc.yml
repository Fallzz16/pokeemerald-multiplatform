name: Grand World GBA - Real Horsea Trade NPC PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-horsea-trade-npc.yml'
      - 'qa/gba/GrandWorldHorseaTradeOffer.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-horsea-npc-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real_intro:
    name: Real Horsea-for-Bagon NPC first contact and safe decline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned original World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM toolchain and mGBA dependencies (bounded, fail closed)
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo 'APT update: bounded to 360s (prior runner stalled before game tests)'
          timeout --signal=TERM --kill-after=15s 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          echo 'APT installation: bounded to 420s, no interactive prompts'
          timeout --signal=TERM --kill-after=15s 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          command -v arm-none-eabi-gcc
          luac5.4 -p grandworld/qa/gba/GrandWorldHorseaTradeOffer.lua
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('world')
          groups=json.loads((root/'data/maps/map_groups.json').read_text())
          coords=[(n,groups[g].index('PacifidlogTown_House3'))
                  for n,g in enumerate(groups['group_order'])
                  if 'PacifidlogTown_House3' in groups[g]]
          assert coords==[(7,4)],coords
          mp=json.loads((root/'data/maps/PacifidlogTown_House3/map.json').read_text())
          assert mp['id']=='MAP_PACIFIDLOG_TOWN_HOUSE3'
          assert any(e['x']==4 and e['y']==2 and e['script']=='PacifidlogTown_House3_EventScript_Trader'
                     and e['flag']=='0' for e in mp['object_events'])
          assert mp['warp_events'][0]['x']==4
          script=(root/'data/maps/PacifidlogTown_House3/scripts.inc').read_text()
          assert 'ingame_trade INGAME_TRADE_HORSEA' in script
          assert 'setflag FLAG_PACIFIDLOG_NPC_TRADE_COMPLETED' in script
          flags=(root/'include/constants/flags.h').read_text()
          assert re.search(r'#define FLAG_PACIFIDLOG_NPC_TRADE_COMPLETED\s+0x9A\b',flags)
          trade=(root/'include/constants/trade.h').read_text()
          assert 'INGAME_TRADE_HORSEA' in trade
          print('Pinned trade NPC, map, coordinates and persistent flag confirmed')
          PY
      - name: Compose pinned GBA M8 and PT-BR without changing the source engine
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report horse-trade-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report horse-trade-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report horse-trade-translation.json
          cp grandworld/qa/gba/GrandWorldHorseaTradeOffer.lua world/test/overworld/lua/
          git -C world diff --check
      - name: Build PT-BR GBA cartridge to test only trade NPC
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 > horse-trade-build.log 2>&1
          test -s world/pokemonworld.gba
      - name: Build known pinned headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Physically walk to in-game Horsea trader and safely decline
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/horse-trade-proofs/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          rm -f "$PW_OUT/GrandWorldHorseaTradeOffer.PASS" "$PW_OUT/GrandWorldHorseaTradeOffer.FAIL"
          PW_TIMEOUT=600 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldHorseaTradeOffer.lua "$PWD/pokemonworld.gba" \
            | tee "$PW_OUT/GrandWorldHorseaTradeOffer.stdout.log"
          test -s "$PW_OUT/GrandWorldHorseaTradeOffer.PASS"
          test ! -e "$PW_OUT/GrandWorldHorseaTradeOffer.FAIL"
          grep -Eq "^PASS 11/11 rom=$md5 .* suite=GrandWorldHorseaTradeOffer$" "$PW_OUT/GrandWorldHorseaTradeOffer.PASS"
      - name: Record narrow ROM-bound NPC access proof, no Horsea obtained claim
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          base=Path('horse-trade-proofs')
          rom=Path('world/pokemonworld.gba').read_bytes()
          md5=hashlib.md5(rom).hexdigest().upper()
          data=(base/'GrandWorldHorseaTradeOffer.PASS').read_text()
          assert re.fullmatch(rf'PASS 11/11 rom={md5} at=[^\r\n]+ suite=GrandWorldHorseaTradeOffer\s*',data)
          assert not (base/'GrandWorldHorseaTradeOffer.FAIL').exists()
          proof={'target':'GBA PT-BR ARM in headless mGBA',
                 'rom_sha256':hashlib.sha256(rom).hexdigest(),
                 'actual_npc_first_contact_checks':11,
                 'source_npc_script':'PacifidlogTown_House3_EventScript_Trader',
                 'offered':'SPECIES_HORSEA','requested':'SPECIES_BAGON',
                 'trade_completed_in_game_verified':False,
                 'debug_party_used_for_legal_initial_battle_mon':True,
                 'real_trade_without_debug_bagon_verified':False,'release_approved':False}
          (base/'result.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Keep only QA logs, screenshots, hashes and patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_HORSEA_TRADE_NPC_EVIDENCE
          if-no-files-found: warn
          path: |
            horse-trade-proofs/
            horse-trade-translation.json
            horse-trade-build.log
            horse-trade-shadow.json
            horse-trade-grass.json
