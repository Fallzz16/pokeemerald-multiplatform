name: GBA ROM modern build and agbcc diagnostic
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gba-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  gba-modern:
    name: Build modern GBA ROM (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      MODERN: '1'
      COMPARE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: firered-source
          sparse-checkout: |
            data
            src/data
            include/constants
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install modern GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
          python -m pip install Pillow
          arm-none-eabi-gcc --version
      - name: Validate legacy and modern macro guards
        run: |
          python -m unittest discover -s tests -p test_gba_syscall_guards.py -v
          python -m unittest discover -s tests -p test_gba_source_partition.py -v
          python -m unittest discover -s tests -p test_gba_memory_audit.py -v
          python -m unittest discover -s tests -p test_gba_quest_log_bss.py -v
          python -m unittest discover -s tests -p test_gba_rom_audit.py -v
      - name: Materialize all Kanto maps and event content
        run: |
          set -euxo pipefail
          python tools/kanto/import_exteriors.py --firered firered-source --emerald . --report kanto-gba-materialization.json
          python - <<'PY'
          import json
          from pathlib import Path
          groups=json.loads(Path("data/maps/map_groups.json").read_text())
          kanto=[name for key, maps in groups.items() if key.startswith("gMapGroup_Kanto") for name in maps]
          assert len(kanto)==114, (len(kanto),[(k,len(v)) for k,v in groups.items() if k.startswith("gMapGroup_Kanto")])
          assert Path("data/maps/Kanto_MtMoon_B2F/map.json").exists()
          PY
      - name: Build modern ROM without original ROM checksum comparison
        shell: bash
        run: |
          set -o pipefail
          make -j2 MODERN=1 COMPARE=0 all 2>&1 | tee gba-modern-build.log
          test -s pokeemerald_modern.gba
          python - <<'PY'
          from pathlib import Path
          size=Path("pokeemerald_modern.gba").stat().st_size
          assert size<=32*1024*1024, f"ROM exceeds 32MiB: {size}"
          print(f"ROM generated: {size} bytes")
          PY
          python tools/kanto/gba_rom_audit.py --rom pokeemerald_modern.gba --output gba-rom-audit.json
          sha256sum pokeemerald_modern.gba > gba-modern-sha256.txt
      - name: Report largest ARM .bss symbols after build (including failed link)
        if: always()
        run: |
          if [ -d build/modern/src ]; then
            python tools/kanto/gba_memory_audit.py --objdir build/modern/src --output gba-bss-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KANTO_V25_GBA_MODERN
          path: |
            gba-modern-build.log
            gba-modern-sha256.txt
            gba-rom-audit.json
            gba-bss-report.json
            kanto-gba-materialization.json
            pokeemerald_modern.gba
            pokeemerald_modern.elf
            pokeemerald_modern.map
          if-no-files-found: warn
          retention-days: 30
  gba-agbcc-legacy:
    name: Legacy agbcc diagnostic (nonblocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    continue-on-error: true
    env:
      MODERN: '0'
      COMPARE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: firered-source
          sparse-checkout: |
            data
            src/data
            include/constants
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools and agbcc
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev zlib1g-dev
          python -m pip install Pillow
          cd agbcc
          ./build.sh
          ./install.sh ../
      - name: Validate macro guard regression
        run: |
          python -m unittest discover -s tests -p test_gba_syscall_guards.py -v
          python -m unittest discover -s tests -p test_gba_source_partition.py -v
          python -m unittest discover -s tests -p test_gba_memory_audit.py -v
          python -m unittest discover -s tests -p test_gba_quest_log_bss.py -v
          python -m unittest discover -s tests -p test_gba_rom_audit.py -v
      - name: Materialize matching Kanto source content
        run: python tools/kanto/import_exteriors.py --firered firered-source --emerald . --report kanto-legacy-materialization.json
      - name: Build legacy ROM without equality-to-original comparison
        shell: bash
        run: |
          set -o pipefail
          make -j2 MODERN=0 COMPARE=0 all 2>&1 | tee gba-legacy-build.log
          test -s pokeemerald.gba
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KANTO_V25_GBA_AGBCC_LOG
          path: |
            gba-legacy-build.log
            kanto-legacy-materialization.json
            pokeemerald.gba
          if-no-files-found: warn
          retention-days: 30

  gba-headless-smoke:
    name: mGBA headless startup smoke (advisory; not gameplay QA)
    needs: gba-modern
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KANTO_V25_GBA_MODERN
          path: gba-artifact
      - name: Install official Ubuntu libmgba development package
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmgba-dev
      - name: Build and run no-GUI GBA core for 9600 frames
        shell: bash
        run: |
          set -euxo pipefail
          cc -std=gnu11 -O2 -Wall -Wextra tools/kanto/gba_headless_smoke.c -o /tmp/gba_headless_smoke -lmgba
          /tmp/gba_headless_smoke gba-artifact/pokeemerald_modern.gba
          test -s gba-headless-smoke.txt
      - name: Attach disposable frame captures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KANTO_V25_MGBA_HEADLESS_ADVISORY
          path: |
            gba-headless-smoke.txt
            gba-boot-frame-120.ppm
            gba-boot-frame-420.ppm
            gba-boot-frame-1800.ppm
            gba-boot-frame-3600.ppm
            gba-boot-frame-4200-after-start.ppm
            gba-navigation-frame-4700.ppm
            gba-navigation-frame-5200.ppm
            gba-navigation-frame-6000.ppm
            gba-navigation-frame-7400.ppm
            gba-navigation-frame-9600.ppm
          if-no-files-found: warn
          retention-days: 14
