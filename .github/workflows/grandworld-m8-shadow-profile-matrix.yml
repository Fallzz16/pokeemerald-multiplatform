name: Grand World M8 - Shadow Profile Matrix
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-m8-shadow-profile-matrix.yml'
      - 'tools/grandworld/optimize_overworld_budget.py'
      - 'tools/grandworld/tests/test_optimize_overworld_budget.py'
      - 'tools/grandworld/evaluate_performance_budget.py'
      - 'tools/grandworld/tests/test_evaluate_performance_budget.py'
      - 'tools/grandworld/compare_shadow_profiles.py'
      - 'tools/grandworld/tests/test_compare_shadow_profiles.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-m8-shadow-matrix-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  compile:
    name: GBA O2 / ${{ matrix.shadows }} shadows
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shadows: [lean, full]
    steps:
      - name: Checkout Grand World experiments
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout identical immutable World source
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
          fetch-depth: 0
      - name: Install GBA compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
      - name: Apply same M8 integration, differing only in shadows flag
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows ${{ matrix.shadows }} --report shadow-profile.json
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p 'test_*.py'
          git -C world diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          profile=json.loads(Path('shadow-profile.json').read_text())
          expected='${{ matrix.shadows }}'
          assert profile['resolved_shadow_mode']==expected
          config=Path('world/include/config/overworld.h').read_text()
          assert ('#define OW_OBJECT_VANILLA_SHADOWS      TRUE' in config) == (expected=='lean')
          assert '#define OW_GFX_COMPRESS                FALSE' in config
          PY
      - name: Compile production code without LTO
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 2>&1 | tee shadow-build.log
          make -C world validate 2>&1 | tee shadow-validate.log
      - name: Strict ROM/header/memory budgets and reference audit
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/evaluate_performance_budget.py world/pokemonworld.gba shadow-build.log --output shadow-budget.json
          python3 grandworld/tools/grandworld/audit_lz77_resources.py world/pokemonworld.gba --output shadow-lz77.json
      - name: Publish metrics only; no game ROMs or saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRANDWORLD_M8_SHADOW_${{ matrix.shadows }}_DIAGNOSTICS
          if-no-files-found: warn
          path: |
            shadow-profile.json
            shadow-budget.json
            shadow-lz77.json
            shadow-build.log
            shadow-validate.log
  compare:
    name: Compare O2 graphics trade-offs (not FPS)
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout comparison tool
        uses: actions/checkout@v4
      - name: Download lean measurements
        uses: actions/download-artifact@v4
        with:
          name: GRANDWORLD_M8_SHADOW_lean_DIAGNOSTICS
          path: lean
      - name: Download full measurements
        uses: actions/download-artifact@v4
        with:
          name: GRANDWORLD_M8_SHADOW_full_DIAGNOSTICS
          path: full
      - name: Validate identical-source profiles and real ROM evidence
        run: |
          set -euo pipefail
          python3 tools/grandworld/compare_shadow_profiles.py \
            lean/shadow-profile.json full/shadow-profile.json \
            lean/shadow-budget.json full/shadow-budget.json \
            lean/shadow-lz77.json full/shadow-lz77.json \
            --output m8-shadow-comparison.json
          test -s m8-shadow-comparison.json
      - name: Publish only compare JSON
        uses: actions/upload-artifact@v4
        with:
          name: GRANDWORLD_M8_SHADOW_AB_COMPARISON
          path: m8-shadow-comparison.json
