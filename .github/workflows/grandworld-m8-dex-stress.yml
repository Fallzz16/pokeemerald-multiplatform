name: Grand World M8 - Extended Pokedex Stress
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-m8-dex-stress.yml'
      - 'tools/grandworld/expand_120_extra.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-m8-dex-stress-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  gen4_gen5_gen6_stress:
    name: Build GBA with 151 additional Pokemon family lines
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: grandworld
      - uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
      - name: Apply Grand World code and 151-family pilot with checks
        run: |
          python3 -m py_compile grandworld/tools/grandworld/*.py
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply
          python3 grandworld/tools/grandworld/expand_120_extra.py world --apply
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          git -C world diff --check
          python3 - <<'PY'
          import json
          a=json.load(open('m8-gen4-encounters-evidence.json'))
          b=json.load(open('m8-extended-families-evidence.json'))
          assert a['family_count']==31
          assert b['additional_families']==120
          assert b['total_gen4plus_families']==151
          assert b['modified_table_variants']>=120
          PY
      - name: ARM GBA build with 151 new obtainable families
        shell: bash
        run: |
          set -o pipefail
          make -C world modern -j2 2>&1 | tee expanded-build.log
      - name: Validate world scripts, maps, and exact family whitelist
        shell: bash
        run: |
          set -o pipefail
          make -C world validate 2>&1 | tee expanded-validate.log
      - name: Fail closed on GBA memory budget
        run: |
          python3 - <<'PY'
          import hashlib,re,json
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          assert len(rom)==33554432,len(rom)
          assert rom[0xac:0xb0]==b'BPEE'
          assert (sum(rom[0xa0:0xbd])+rom[0xbd]+0x19)&255==0
          pairs=re.findall(r'(?m)^\s*(EWRAM|IWRAM|ROM):\s+([0-9]+) B',Path('expanded-build.log').read_text())
          memory={k:int(v) for k,v in pairs[-3:]}
          assert set(memory)=={'ROM','EWRAM','IWRAM'},memory
          assert memory['ROM']<=33554432 and memory['EWRAM']<=262144 and memory['IWRAM']<=32768,memory
          evidence={'rom_sha256':hashlib.sha256(rom).hexdigest(),
                    'rom_size':len(rom),'memory':memory,
                    'extra_species_families':151,'gameplay_verified':False}
          Path('m8-151-families-build-evidence.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence,indent=2))
          PY
      - name: Upload audit only; never copyrighted ROM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GRANDWORLD_M8_151_FAMILIES_AUDIT
          path: |
            expanded-build.log
            expanded-validate.log
            m8-151-families-build-evidence.json
            m8-gen4-encounters-evidence.json
            m8-extended-families-evidence.json
            grandworld/tools/grandworld/*.py
          if-no-files-found: warn
