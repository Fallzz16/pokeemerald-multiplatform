name: Grand World GBA - Horsea Level 32 Seadra Evolution PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-horsea-seadra-evolution.yml'
      - 'qa/gba/GrandWorldHorseaSeadraEvolution.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-horsea-seadra-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  horse_seadra:
    name: Use authentic GBA Bag Rare Candy to evolve Horsea to Seadra
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout exact pinned World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM and emulator build dependencies (bounded)
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          timeout --signal=TERM --kill-after=15s 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          command -v arm-none-eabi-gcc
          luac5.4 -p grandworld/qa/gba/GrandWorldHorseaSeadraEvolution.lua
          python3 - <<'PY'
          import re
          from pathlib import Path
          w=Path('world')
          species=(w/'include/constants/species.h').read_text()
          items=(w/'include/constants/items.h').read_text()
          family=(w/'src/data/pokemon/species_info/gen_1_families.h').read_text()
          pkm=(w/'include/pokemon.h').read_text()
          assert 'SPECIES_HORSEA = 116' in species
          assert 'SPECIES_SEADRA = 117' in species
          assert re.search(r'ITEM_RARE_CANDY\s*=\s*102\b',items)
          assert '.evolutions = EVOLUTION({EVO_LEVEL, 32, SPECIES_SEADRA})' in family
          assert 'struct BoxPokemon' in pkm and 'struct Pokemon\n{' in pkm
          assert 'u32 status;\n    u8 level;' in pkm
          assert 'sSubstructOffsets[4][24]' in (w/'src/pokemon.c').read_text()
          print('Pinned Horsea, Seadra, Rare Candy, level-32 evolution and party layout verified')
          PY
      - name: Compose only pinned M8 and ASCII PT-BR into throwaway World checkout
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report seadra-evolution-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report seadra-evolution-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report seadra-evolution-translation.json
          cp grandworld/qa/gba/GrandWorldHorseaSeadraEvolution.lua world/test/overworld/lua/
          git -C world diff --check
      - name: Build real ARM GBA cartridge for new gift-only acceptance
        run: |
          set -euo pipefail
          make -C world modern -j2 > seadra-evolution-build.log 2>&1
          test -s world/pokemonworld.gba
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          assert rom[0xAC:0xB0]==b'BPEE',rom[0xAC:0xB0]
          assert len(rom)<=32*1024*1024,len(rom)
          print('Real GBA ARM BPEE cartridge size',len(rom))
          PY
      - name: Build pinned known-working headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Use real Rare Candy in Bag and verify actual Seadra evolution in mGBA
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/seadra-evolution-proofs/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          rm -f "$PW_OUT/GrandWorldHorseaSeadraEvolution.PASS" "$PW_OUT/GrandWorldHorseaSeadraEvolution.FAIL"
          PW_TIMEOUT=600 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldHorseaSeadraEvolution.lua "$PWD/pokemonworld.gba" \
            | tee "$PW_OUT/GrandWorldHorseaSeadraEvolution.stdout.log"
          test -s "$PW_OUT/GrandWorldHorseaSeadraEvolution.PASS"
          test ! -e "$PW_OUT/GrandWorldHorseaSeadraEvolution.FAIL"
          grep -Eq "^PASS 14/14 rom=$md5 .* suite=GrandWorldHorseaSeadraEvolution$" "$PW_OUT/GrandWorldHorseaSeadraEvolution.PASS"
      - name: Record evidence only after exact ROM-bound 14/14
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          base=Path('seadra-evolution-proofs')
          md5=hashlib.md5(rom).hexdigest().upper()
          p=(base/'GrandWorldHorseaSeadraEvolution.PASS').read_text()
          assert re.fullmatch(rf'PASS 14/14 rom={md5} at=[^\r\n]+ suite=GrandWorldHorseaSeadraEvolution\s*',p)
          assert not (base/'GrandWorldHorseaSeadraEvolution.FAIL').exists()
          proof={'platform':'GBA ARM in pinned mGBA','rom_sha256':hashlib.sha256(rom).hexdigest(),
                 'original_source_evolution':'HORSEA EVO_LEVEL 32 SEADRA',
                 'rare_candy_used_with_real_bag':True,
                 'live_species_change_horsea_to_seadra':True,'checks':14,
                 'debug_mon_and_item_used_only_for_test_setup':True,
                 'normal_story_horsea_acquisition_verified':False,
                 'original_m8_modified':False,'release_approved':False}
          (base/'result.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Upload logs, hashes, JSON and screenshots (never ROM or save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_HORSEA_SEADRA_EVOLUTION_EVIDENCE
          if-no-files-found: warn
          path: |
            seadra-evolution-proofs/
            seadra-evolution-translation.json
            seadra-evolution-shadow.json
            seadra-evolution-grass.json
            seadra-evolution-build.log
