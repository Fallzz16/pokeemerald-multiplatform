name: Grand World GBA - Real Horsea to Seadra Level Evolution PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-seadra-level-evolution.yml'
      - 'qa/gba/GrandWorldSeadraLevelEvolution.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-seadra-level-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  seadra_evolution:
    name: Evolve real Horsea with Bag Rare Candy controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout exact pinned World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM and emulator build dependencies (bounded)
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          timeout --signal=TERM --kill-after=15s 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          command -v arm-none-eabi-gcc
          luac5.4 -p grandworld/qa/gba/GrandWorldSeadraLevelEvolution.lua
          python3 - <<'PY'
          import re
          from pathlib import Path
          w=Path('world')
          items=(w/'include/constants/items.h').read_text()
          species=(w/'include/constants/species.h').read_text()
          assert re.search(r'ITEM_RARE_CANDY\s*=\s*102',items)
          assert re.search(r'SPECIES_HORSEA\s*=\s*116',species)
          assert re.search(r'SPECIES_SEADRA\s*=\s*117',species)
          party=(w/'include/pokemon.h').read_text()
          assert 'struct BoxPokemon box;' in party
          assert 'u8 level;' in party
          assert 'sSubstructOffsets[4][24]' in (w/'src/pokemon.c').read_text()
          start=(w/'include/constants/unbound_start_menu.h').read_text()
          assert re.search(r'USM_ICO_PARTY,\s*USM_ICO_BAG,',start)
          print('Pinned original Horsea, Seadra, Rare Candy and encrypted party source verified')
          PY
      - name: Compose only pinned M8 and ASCII PT-BR into throwaway World checkout
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report seadra-level-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report seadra-level-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report seadra-level-translation.json
          cp grandworld/qa/gba/GrandWorldSeadraLevelEvolution.lua world/test/overworld/lua/
          git -C world diff --check
      - name: Build real ARM GBA cartridge for new evolution-only acceptance
        run: |
          set -euo pipefail
          make -C world modern -j2 > seadra-level-build.log 2>&1
          test -s world/pokemonworld.gba
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          assert rom[0xAC:0xB0]==b'BPEE',rom[0xAC:0xB0]
          assert len(rom)<=32*1024*1024,len(rom)
          print('Real GBA ARM BPEE cartridge size',len(rom))
          PY
      - name: Build pinned known-working headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Use original GBA Bag and evolve Horsea to Seadra in mGBA
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/seadra-level-evolution-proofs/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          rm -f "$PW_OUT/GrandWorldSeadraLevelEvolution.PASS" "$PW_OUT/GrandWorldSeadraLevelEvolution.FAIL"
          PW_TIMEOUT=600 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldSeadraLevelEvolution.lua "$PWD/pokemonworld.gba" \
            | tee "$PW_OUT/GrandWorldSeadraLevelEvolution.stdout.log"
          test -s "$PW_OUT/GrandWorldSeadraLevelEvolution.PASS"
          test ! -e "$PW_OUT/GrandWorldSeadraLevelEvolution.FAIL"
          grep -Eq "^PASS 12/12 rom=$md5 .* suite=GrandWorldSeadraLevelEvolution$" "$PW_OUT/GrandWorldSeadraLevelEvolution.PASS"
      - name: Record evidence only after exact ROM-bound 12/12
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          base=Path('seadra-level-evolution-proofs')
          md5=hashlib.md5(rom).hexdigest().upper()
          p=(base/'GrandWorldSeadraLevelEvolution.PASS').read_text()
          assert re.fullmatch(rf'PASS 12/12 rom={md5} at=[^\r\n]+ suite=GrandWorldSeadraLevelEvolution\s*',p)
          assert not (base/'GrandWorldSeadraLevelEvolution.FAIL').exists()
          proof={'platform':'GBA ARM in pinned mGBA','rom_sha256':hashlib.sha256(rom).hexdigest(),
                 'evolution_test':'HORSEA_L31_RARE_CANDY_SEADRA_L32',
                 'live_horsea_to_seadra_evolution_verified':True,'checks':12,
                 'debug_party_and_item_setup':True,
                 'natural_horsea_source_verified':False,
                 'original_m8_modified':False,'release_approved':False}
          (base/'result.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Upload logs, hashes, JSON and screenshots (never ROM or save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_SEADRA_LEVEL_EVOLUTION_EVIDENCE
          if-no-files-found: warn
          path: |
            seadra-level-evolution-proofs/
            seadra-level-translation.json
            seadra-level-shadow.json
            seadra-level-grass.json
            seadra-level-build.log
