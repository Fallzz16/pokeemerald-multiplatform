name: Grand World - PT-BR Experimental GBA

on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-ptbr-stage1.yml'
      - 'tools/grandworld/translate_ptbr_stage1.py'
      - 'tools/grandworld/ptbr_extra_core.json'
      - 'tools/grandworld/ptbr_extra_events.json'
      - 'tools/grandworld/ptbr_extra_world.json'
      - 'tools/grandworld/ptbr_extra_battle.json'
      - 'tools/grandworld/ptbr_extra_services2.json'
      - 'tools/grandworld/ptbr_extra_regions2.json'
      - 'tools/grandworld/tests/test_translate_ptbr_stage1.py'
      - 'docs/GRANDWORLD_PTBR_TRANSLATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grandworld-ptbr-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ptbr:
    name: PT-BR source tests and isolated real GBA build
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout Grand World localization
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout immutable World game base
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
          fetch-depth: 0
      - name: Install compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
      - name: Validate Python sources and all patch unit tests
        run: |
          set -euo pipefail
          python3 -m compileall -q grandworld/tools/grandworld
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p 'test_*.py' -v
      - name: Build the same integrated three-region world as post-M8
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report ptbr-m8-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report ptbr-grass-only.json
      - name: Translate menu dialogs Pokédex and save with strict guards
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --report ptbr-preflight.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report ptbr-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('ptbr-report.json').read_text())
          assert a['locale']=='pt-BR' and a['translation_entries']>=810
          assert not a['save_format_modified'] and a['translated_text_ascii_only']
          assert not a['item_names_translated'] and not a['move_names_translated']
          assert 'Novo Jogo' in Path('world/src/main_menu.c').read_text()
          assert 'Quer salvar o jogo?' in Path('world/data/text/save.inc').read_text()
          PY
          git -C world diff --check
      - name: Compile actual GBA cartridge candidate
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 2>&1 | tee ptbr-build.log
          test -s world/pokemonworld.gba
      - name: Validate maps scripts battles and species
        shell: bash
        run: |
          set -euo pipefail
          make -C world validate 2>&1 | tee ptbr-validate.log
      - name: Build pinned mGBA headless for localized ROM gameplay smoke
        run: |
          set -euo pipefail
          sudo apt-get install -y cmake liblua5.4-dev libpng-dev zlib1g-dev
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF \
            -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
          test -x mgba/build/mgba-headless
      - name: Mandatory translated ROM boot and title in actual mGBA
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/SmokeBoot.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/ptbr-smoke-boot.log"
          PW_TIMEOUT=240 test/overworld/mgba-run.sh test/overworld/lua/WorldTitle.lua "$PWD/pokemonworld.gba" | tee "$GITHUB_WORKSPACE/ptbr-smoke-title.log"
          test -s _pwtest/SmokeBoot.PASS
          test -s _pwtest/WorldTitle.PASS
          test ! -e _pwtest/SmokeBoot.FAIL
          test ! -e _pwtest/WorldTitle.FAIL
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          grep -Eq "^PASS [1-9][0-9]*/[1-9][0-9]* rom=$md5 .* suite=SmokeBoot$" _pwtest/SmokeBoot.PASS
          grep -Eq "^PASS [1-9][0-9]*/[1-9][0-9]* rom=$md5 .* suite=WorldTitle$" _pwtest/WorldTitle.PASS
      - name: Mandatory all 51 World gameplay suites on this PT-BR ROM
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          timeout --signal=TERM --kill-after=10s 420s env PW_TIMEOUT=75 test/overworld/run-all.sh "$PWD/pokemonworld.gba" > "$GITHUB_WORKSPACE/ptbr-world-51-suites.log" 2>&1
          grep -q 'green 51 / 51 expected' "$GITHUB_WORKSPACE/ptbr-world-51-suites.log"
          grep -q 'SWEEP OK - every expected suite produced a fresh PASS stamped rom=' "$GITHUB_WORKSPACE/ptbr-world-51-suites.log"
      - name: Verify GBA memory and checksum; produce pinned manifest
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/evaluate_performance_budget.py world/pokemonworld.gba ptbr-build.log --output ptbr-budget.json
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          assert len(rom)==33554432 and rom[0xac:0xb0]==b'BPEE'
          assert rom[0xb2]==0x96 and (sum(rom[0xa0:0xbd])+rom[0xbd]+0x19)%256==0
          budget=json.loads(Path('ptbr-budget.json').read_text())
          report=json.loads(Path('ptbr-report.json').read_text())
          sha=hashlib.sha256(rom).hexdigest()
          assert budget['rom_sha256']==sha and budget['memory_budget_passed']
          out={'locale':'pt-BR','stage':1,'rom_sha256':sha,
               'rom_bytes':len(rom),
               'grandworld_commit':subprocess.check_output(['git','-C','grandworld','rev-parse','HEAD'],text=True).strip(),
               'world_commit':subprocess.check_output(['git','-C','world','rev-parse','HEAD'],text=True).strip(),
               'translated_entries':report['translation_entries'],
               'gameplay_certified':False,'full_translation_complete':False,
               'release_approved':False}
          Path('ptbr-evidence.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Preserve only QA evidence and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRANDWORLD_PTBR_ASCII_EXPANSION_QA_EVIDENCE
          if-no-files-found: warn
          path: |
            ptbr-preflight.json
            ptbr-report.json
            ptbr-budget.json
            ptbr-evidence.json
            ptbr-m8-shadow.json
            ptbr-grass-only.json
            ptbr-build.log
            ptbr-validate.log
            ptbr-smoke-boot.log
            ptbr-smoke-title.log
            ptbr-world-51-suites.log
