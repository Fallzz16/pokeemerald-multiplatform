name: Emerald Hybrid v0.8 Windows graphical launcher
on:
  push:
    branches:
      - feature/lan-v080-mega-desktop-polish
      - feature/lan-v080-desktop-graphical-launcher
      - feature/lan-v0803-dedicated-session-core
    paths:
      - '.github/workflows/package-v0803-ehl8-preview.yml' # rebuild components for packaging-only fixes
      - 'src/lnet/lnet_session_client.c' # rebuild same HEAD for preview package
      - 'src/platform/sdl2.c' # same-SHA preview package rebuild
      - 'tools/emerald_launcher.py'
      - 'tests/test_emerald_launcher.py'
      - '.github/workflows/build-v080-graphical-launcher.yml'
  pull_request:
    paths:
      - 'tools/emerald_launcher.py'
      - 'tests/test_emerald_launcher.py'
      - '.github/workflows/build-v080-graphical-launcher.yml'
  workflow_dispatch:
jobs:
  windows-graphical-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, no save writes and no network
        shell: pwsh
        run: |
          python tools/emerald_launcher.py --self-test
          python -m unittest discover -s tests -p test_emerald_launcher.py -v
      - name: Create stand-alone windowed launcher executable
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EmeraldLauncher tools/emerald_launcher.py
          if (!(Test-Path dist/EmeraldLauncher.exe)) { throw "Launcher executable was not generated" }
      - uses: actions/upload-artifact@v4
        with:
          name: Emerald-Hybrid-v0802-GraphicalLauncher-Windows-x64-Experimental
          path: dist/EmeraldLauncher.exe
          retention-days: 14
          if-no-files-found: error
