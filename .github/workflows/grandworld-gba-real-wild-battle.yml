name: Grand World GBA - Real Walking Wild Battle PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-real-wild-battle.yml'
      - 'qa/gba/GrandWorldWildStep.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-wild-battle-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real_intro:
    name: Unverified real grass wild encounter on PT-BR GBA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned original World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM toolchain and mGBA dependencies (bounded, fail closed)
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo 'APT update: bounded to 360s (prior runner stalled before game tests)'
          timeout --signal=TERM --kill-after=15s 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          echo 'APT installation: bounded to 420s, no interactive prompts'
          timeout --signal=TERM --kill-after=15s 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          command -v arm-none-eabi-gcc
          luac5.4 -p grandworld/qa/gba/GrandWorldWildStep.lua
      - name: Compose pinned GBA M8 and PT-BR without changing the source engine
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report intro-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report intro-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report intro-translation.json
          cp grandworld/qa/gba/GrandWorldWildStep.lua world/test/overworld/lua/
          git -C world diff --check
      - name: Build PT-BR GBA cartridge for focused wild battle QA
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 > intro-gba-build.log 2>&1
          test -s world/pokemonworld.gba
      - name: Build known pinned headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Target only the unverified spontaneous encounter on a real grass tile
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/wild-battle-proofs/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          rm -f "$PW_OUT/GrandWorldWildStep.PASS" "$PW_OUT/GrandWorldWildStep.FAIL"
          PW_TIMEOUT=480 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldWildStep.lua "$PWD/pokemonworld.gba" \
            | tee "$PW_OUT/GrandWorldWildStep.stdout.log"
          test -s "$PW_OUT/GrandWorldWildStep.PASS"
          test ! -e "$PW_OUT/GrandWorldWildStep.FAIL"
          grep -Eq "^PASS 12/12 rom=$md5 .* suite=GrandWorldWildStep$" "$PW_OUT/GrandWorldWildStep.PASS"
      - name: Preserve ROM-bound outcome without treating it as catch or story certification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          proof=Path('wild-battle-proofs/GrandWorldWildStep.PASS').read_text(encoding='utf-8')
          rom=Path('world/pokemonworld.gba').read_bytes()
          md5=hashlib.md5(rom).hexdigest().upper()
          assert re.fullmatch(rf'PASS 12/12 rom={md5} at=[^\r\n]+ suite=GrandWorldWildStep\s*',proof)
          assert not Path('wild-battle-proofs/GrandWorldWildStep.FAIL').exists()
          outcome={'target':'physical GBA ROM PT-BR in headless mGBA','suite':'GrandWorldWildStep',
                   'rom_sha256':hashlib.sha256(rom).hexdigest(),
                   'assertions_passed':12,
                   'grass_random_battle_observed':True,
                   'encounter_started_via':'real avatar movement, no synthetic battle-state write',
                   'capture_certified':False,'escape_to_overworld_certified':False,
                   'grass_only_all_regions_certified':False,'manual_release_approved':False}
          Path('wild-battle-proofs/result.json').write_text(json.dumps(outcome,indent=2)+'\n')
          print(json.dumps(outcome,indent=2))
          PY
      - name: Keep only QA logs, screenshots, hashes and patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_REAL_WILD_BATTLE_EVIDENCE
          if-no-files-found: warn
          path: |
            wild-battle-proofs/
            intro-translation.json
            intro-gba-build.log
            intro-shadow.json
            intro-grass.json
