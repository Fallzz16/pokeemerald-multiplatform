name: Emerald Hybrid Auto QA (Windows + Linux)
on:
  push:
    branches:
      - feature/emerald-v100-m23a-server-first-lab
      - 'feature/emerald-m30-*'
      - 'feature/emerald-m31-*'
    paths:
      - 'tools/emerald_auto_qa.py'
      - 'tools/emerald_qa_lab.py'
      - 'tools/emerald_qa_bots.py'
      - 'tools/emerald_session_server.py'
      - 'tools/emerald_launcher.py'
      - 'src/profile/save_profiles.c'
      - 'src/platform/sdl2.c'
      - 'src/link.c'
      - 'src/lnet/lnet_start_gate.h'
      - 'src/lnet/lnet_wait_overlay.h'
      - 'src/lnet/lnet_session_client.c'
      - 'src/lnet/lnet_session_client.h'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      repeats:
        description: "Repeat each regression suite (1 to 20)"
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '3'
          - '5'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulated-players:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate YAML syntax for every GitHub Actions workflow
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path('.github/workflows').glob('*.yml'))
          if not paths:
              raise SystemExit('No workflow YAML files found')
          for path in paths:
              yaml.compose(path.read_text(encoding='utf-8'))
              print(f'YAML syntax OK: {path}')
          PY
      - name: Compile Python QA and protocol modules
        run: python -m compileall -q tools/emerald_auto_qa.py tools/emerald_qa_lab.py tools/emerald_qa_bots.py
      - name: Verify native save copies and backups on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc -std=c99 -Wall -Wextra -O2 -Isrc/profile src/profile/save_profiles.c tests/test_save_profiles.c -o /tmp/emerald-save-qa
          /tmp/emerald-save-qa
      - name: Verify opt-in EHL8 input gate in native C (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -O2 tests/test_ehl8_start_gate.c -o /tmp/emerald-ehl8-gate-qa
          /tmp/emerald-ehl8-gate-qa
      - name: Verify EHL8 in-game waiting overlay guards (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -O2 tests/test_ehl8_wait_overlay.c -o /tmp/emerald-ehl8-overlay-qa
          /tmp/emerald-ehl8-overlay-qa
      - name: Validate native EHL8 PLAYER_LIST parser (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc -std=c99 -DPORTABLE -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -O2 -Isrc/lnet tests/test_ehl8_player_list_parser.c src/lnet/lnet_net.c src/lnet/lnet_session_v1.c src/lnet/lnet_presence.c -o /tmp/emerald-lobby-parser
          /tmp/emerald-lobby-parser
      - name: Run simulated player regression QA
        shell: bash
        env:
          QA_REPEATS: ${{ inputs.repeats || '1' }}
        run: |
          python tools/emerald_auto_qa.py --group all --repeats "$QA_REPEATS" --report auto-qa-report.json
      - name: Write readable CI summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('auto-qa-report.json')
          report=json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
          lines=['## Emerald Hybrid Auto QA', 'Platform: ${{ matrix.os }}', 'Source commit: ${{ github.sha }}']
          if report:
              lines += [f"Passed: {report['passed']} | Failed: {report['failed']}", '',
                        '| Iteration | Test suite | Status |', '|---:|---|---|']
              for x in report['results']:
                  lines.append(f"| {x['iteration']} | {x['suite']} | {x['status']} |")
          else:
              lines += ['No report generated. Inspect the failing setup or runner step.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
      - name: Preserve report even when QA fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Auto-QA-${{ matrix.os }}
          path: auto-qa-report.json
          if-no-files-found: warn
          retention-days: 30
