name: Grand World GBA - Candidate Tall Grass Tile Survey
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-candidate-grass-tiles.yml'
      - 'tools/grandworld/propose_grass_species_recovery.py'
      - 'tools/grandworld/tests/test_propose_grass_species_recovery.py'
      - 'qa/gba/GrandWorldProposedGrassTiles.lua'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tentative_cartridge:
    name: Check whether experimental land encounters have actual GBA grass tiles
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout draft recovery tooling
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout immutable World engine source
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
          fetch-depth: 0
      - name: Install ARM build tools with timeout
        timeout-minutes: 14
        run: |
          set -euo pipefail
          timeout 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          timeout 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev
      - name: Integrate identical pinned M8/PT-BR World only in disposable workspace
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report /tmp/grass-shadows.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report /tmp/grass-policy.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report /tmp/grass-translation.json
      - name: Stage proposed 17 or more species in this one EXPERIMENTAL checkout
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/propose_grass_species_recovery.py \
            world/src/data/wild_encounters.json --maps-dir world/data/maps --report candidate-route-additions.json \
            --experimental-output /tmp/proposed_wild_encounters.json
          python3 grandworld/tools/grandworld/audit_grass_only_access.py \
            world/src/data/wild_encounters.json --output grass-species-before.json
          python3 grandworld/tools/grandworld/audit_grass_only_access.py \
            /tmp/proposed_wild_encounters.json --output grass-species-after.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path('candidate-route-additions.json').read_text())
          b=json.loads(Path('grass-species-before.json').read_text())
          c=json.loads(Path('grass-species-after.json').read_text())
          n=a['proposed_count']
          assert n>0 and n+a['needs_manual_design_count']==b['disabled_method_species_not_in_any_land_table_count']
          assert c['disabled_method_species_not_in_any_land_table_count']==b['disabled_method_species_not_in_any_land_table_count']-n
          assert not a['release_approved'] and not a['grass_tiles_verified']
          PY
          # Intentionally touches the source of the temporary build only;
          # the proposed alternative is NOT committed to the original engine.
          cp /tmp/proposed_wild_encounters.json world/src/data/wild_encounters.json
          git -C world diff --check
      - name: Compile new experimental ARM GBA ROM after changing wild table
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 > experimental-recovery-build.log 2>&1
          test -s world/pokemonworld.gba
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          rom=Path('world/pokemonworld.gba').read_bytes()
          assert len(rom)>0 and len(rom)<=32*1024*1024
          assert rom[0xAC:0xB0]==b'BPEE'
          out={'target':'isolated EXPERIMENTAL ARM GBA cartridge only',
               'rom_sha256':hashlib.sha256(rom).hexdigest(),
               'new_species_availability_runtime_verified':False,
               'new_species_grass_tiles_verified':False,
               'release_approved':False}
          Path('experimental-cartridge-proof.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Generate ROM-specific map coordinates and check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          plan=json.loads(Path('candidate-route-additions.json').read_text())
          groups=json.loads(Path('world/data/maps/map_groups.json').read_text())
          out=[]
          for v in plan['proposals']:
              name=v['map']
              assert re.fullmatch(r'MAP_ROUTE[0-9]+',name),name
              short='Route'+name.removeprefix('MAP_ROUTE')
              found=[(gnum,group.index(short))
                     for gnum,gname in enumerate(groups['group_order'])
                     if short in (group:=groups[gname])]
              assert len(found)==1,(name,found)
              gn,mn=found[0]
              out.append(dict(name=name,species=v['species'],group=gn,map=mn))
          assert len(out)==plan['proposed_count'] and len(out)>0
          def q(s):return json.dumps(s,ensure_ascii=True)
          code='return {\n'+''.join(
              f'  {{name={q(x["name"])}, species={q(x["species"])}, group={x["group"]}, map={x["map"]}}},\n'
              for x in out)+'}\n'
          Path('world/test/overworld/lua/proposed_grass_routes.lua').write_text(code)
          Path('candidate-map-id-report.json').write_text(json.dumps(out,indent=2)+'\n')
          print(f"Generated {len(out)} ROM-specific mapped proposals (no hardcoded IDs)")
          PY
          cp grandworld/qa/gba/GrandWorldProposedGrassTiles.lua world/test/overworld/lua/
      - name: Build pinned mGBA with actual cartridge CPU and memory layout
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake liblua5.4-dev lua5.4
          luac5.4 -p world/test/overworld/lua/GrandWorldProposedGrassTiles.lua
          luac5.4 -p world/test/overworld/lua/proposed_grass_routes.lua
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Survey grass metatile behaviour on only the 17 new candidate maps
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/proposed-grass-tile-proofs/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          PW_TIMEOUT=720 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldProposedGrassTiles.lua "$PWD/pokemonworld.gba" \
            | tee "$PW_OUT/GrandWorldProposedGrassTiles.stdout.log"
          expected=$(python3 -c "import json; print(1 + 3*json.load(open('../candidate-route-additions.json'))['proposed_count'])")
          test -s "$PW_OUT/GrandWorldProposedGrassTiles.PASS"
          test ! -e "$PW_OUT/GrandWorldProposedGrassTiles.FAIL"
          grep -Eq "^PASS $expected/$expected rom=$md5 .* suite=GrandWorldProposedGrassTiles$" "$PW_OUT/GrandWorldProposedGrassTiles.PASS"
      - name: Record only proof for grass tile existence, not species availability
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          plan=json.loads(Path('candidate-route-additions.json').read_text())
          rom=Path('world/pokemonworld.gba').read_bytes()
          proof={'rom_sha256':hashlib.sha256(rom).hexdigest(),
                 'scanned_candidate_maps':plan['proposed_count'],
                 'grass_tile_existence_verified':True,
                 'all_candidate_tiles_accessible_by_walking_verified':False,
                 'species_random_encounter_verified':False,
                 'biome_plausibility_reviewed':False,
                 'release_approved':False}
          Path('proposed-grass-tile-proofs/grass-tile-report.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Store only reports and logs; no copyrighted ROM or saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_EXPERIMENTAL_GRASS_TILE_SURVEY
          if-no-files-found: warn
          path: |
            candidate-route-additions.json
            grass-species-before.json
            grass-species-after.json
            experimental-cartridge-proof.json
            experimental-recovery-build.log
            candidate-map-id-report.json
            proposed-grass-tile-proofs/
