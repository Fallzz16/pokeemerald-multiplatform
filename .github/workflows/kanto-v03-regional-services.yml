name: Kanto V0.3 Regional Pokemon Centers and Marts
on:
  push:
    branches:
      - feature/kanto-v03-regional-services
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-exterior:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original ferry and importer syntax
        run: |
          python -m compileall -q tools/kanto
          python -m unittest discover -s tests -p test_kanto_preflight.py -v
          python -m unittest discover -s tests -p test_kanto_gateway.py -v
      - uses: actions/checkout@v4
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: firered-source
          sparse-checkout: |
            data
            src/data
            include/constants
          sparse-checkout-cone-mode: true
      - name: Install compiler and binary tile encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-i686 binutils-mingw-w64-i686 libpng-dev zlib1g-dev curl ca-certificates file
          python -m pip install Pillow
      - name: Materialize original 38 surface maps and source graphics
        run: |
          set -euxo pipefail
          python tools/kanto/import_exteriors.py --firered firered-source --emerald . --report kanto-exteriors-import.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('kanto-exteriors-import.json').read_text())
          assert report['geometry_maps_created'] == 38, report
          assert Path('data/layouts/Kanto_VermilionCity/map.bin').stat().st_size == 3840
          assert Path('data/maps/Kanto_Route6/map.json').is_file()
          assert Path('data/maps/Kanto_Route11/map.json').is_file()
          assert report['wild_encounter_maps_ported'] >= 20, report
          assert report['wild_encounters_ported'] is True
          em_encounters = json.loads(Path('src/data/wild_encounters.json').read_text())
          all_maps = {q['map']: q
                      for group in em_encounters['wild_encounter_groups']
                      for q in group['encounters'] if 'map' in q}
          assert 'MAP_KANTO_ROUTE1' in all_maps
          assert all_maps['MAP_KANTO_ROUTE1']['land_mons']['mons']
          assert report['original_npcs_ported'] == 0
          assert report['interior_warps_ported'] == 17
          assert report['original_interiors_ported'] == 17
          assert len(report['interior_maps']) == len(set(report['interior_maps'])) == 17
          assert "Kanto_VermilionCity_PokemonCenter_1F" in report['interior_maps']
          assert "Kanto_SaffronCity_Mart" in report['interior_maps']
          assert "Kanto_CeladonCity_PokemonCenter_1F" in report['interior_maps']
          assert report['qa_npcs_added_in_vermilion'] == 3
          assert report['qa_party_heal'] and report['qa_scripted_pidgey_battle']
          from struct import unpack_from
          original=Path("data/layouts/Kanto_VermilionCity/map.bin").read_bytes()
          m=json.loads(Path("data/maps/Kanto_VermilionCity/map.json").read_text())
          entry={obj["script"]:obj for obj in m["object_events"]}
          for script,position in [
            ("Kanto_VermilionCity_EventScript_ReturnFerry", report["landing"]["sailor"]),
            ("Kanto_VermilionCity_EventScript_TestHeal", report["landing"]["healer"]),
            ("Kanto_VermilionCity_EventScript_TestWildBattle", report["landing"]["encounter"]),
          ]:
            x,y,elevation=position
            assert (entry[script]["x"],entry[script]["y"],entry[script]["elevation"]) == (x,y,elevation)
            raw=unpack_from("<H",original,2*(y*48+x))[0]
            assert (raw&0x0C00)==0, (script,x,y,"solid tile")
            assert raw >> 12 == elevation, (script,x,y,"wrong elevation")
          ax,ay,ae=report["landing"]["arrival"]
          assert (unpack_from("<H",original,2*(ay*48+ax))[0]&0x0C00)==0
          ferry=Path("data/maps/SlateportCity_Harbor/scripts.inc").read_text()
          assert f"warp MAP_KANTO_VERMILIONCITY, {ax}, {ay}" in ferry
          assert len(json.loads(Path("data/maps/map_groups.json").read_text())["gMapGroup_Kanto"])==56
          # Exact FireRed interior dimensions, linked entrance and return doors.
          layouts=json.loads(Path("data/layouts/layouts.json").read_text())["layouts"]
          lookup={entry["id"]: entry for entry in layouts if "id" in entry}
          assert (lookup["LAYOUT_KANTO_POKEMON_CENTER_1F"]["width"],
                  lookup["LAYOUT_KANTO_POKEMON_CENTER_1F"]["height"]) == (15,10)
          assert (lookup["LAYOUT_KANTO_MART"]["width"],
                  lookup["LAYOUT_KANTO_MART"]["height"]) == (11,9)
          assert lookup["LAYOUT_KANTO_POKEMON_CENTER_1F"]["primary_tileset"] == "gTileset_KantoBuilding"
          center=json.loads(Path("data/maps/Kanto_VermilionCity_PokemonCenter_1F/map.json").read_text())
          mart=json.loads(Path("data/maps/Kanto_VermilionCity_Mart/map.json").read_text())
          assert [(w["x"],w["y"]) for w in center["warp_events"]] == [(6,8),(7,8),(8,8)]
          assert [(w["x"],w["y"]) for w in mart["warp_events"]] == [(3,7),(4,7),(5,7)]
          assert len(m["warp_events"]) == 2
          assert m["warp_events"][0]["dest_map"] == center["id"]
          assert m["warp_events"][1]["dest_map"] == mart["id"]
          assert all(w["dest_map"] == m["id"] and w["dest_warp_id"] == "0"
                     for w in center["warp_events"])
          assert all(w["dest_map"] == m["id"] and w["dest_warp_id"] == "1"
                     for w in mart["warp_events"])
          center_scripts=Path("data/maps/Kanto_VermilionCity_PokemonCenter_1F/scripts.inc").read_text()
          mart_scripts=Path("data/maps/Kanto_VermilionCity_Mart/scripts.inc").read_text()
          assert "Common_EventScript_PkmnCenterNurse" in center_scripts
          assert "pokemart Kanto_VermilionMart_Items" in mart_scripts
          assert "LOCALID_KANTO_VERMILION_NURSE" in center_scripts
          # Check every generated city service can return via the exact exterior warp.
          city_map_dirs = ("ViridianCity", "PewterCity", "CeruleanCity",
                           "LavenderTown", "CeladonCity", "VermilionCity",
                           "FuchsiaCity", "CinnabarIsland", "SaffronCity")
          for city in city_map_dirs:
            exterior=json.loads((Path("data/maps") / ("Kanto_"+city) / "map.json").read_text())
            targets={w["dest_map"] for w in exterior["warp_events"]}
            expected_center="MAP_KANTO_"+city.upper()+"_POKEMONCENTER_1F"
            assert expected_center in targets,(city,"no Pokemon Center entrance")
            expected_mart="MAP_KANTO_"+city.upper()+"_MART"
            if city!="CeladonCity":
              assert expected_mart in targets,(city,"no Mart entrance")
          for name in report['interior_maps']:
            inner=json.loads((Path("data/maps")/name/"map.json").read_text())
            city=name.removeprefix("Kanto_").split("_",1)[0]
            outside=json.loads((Path("data/maps")/("Kanto_"+city)/"map.json").read_text())
            indexes=[i for i,w in enumerate(outside["warp_events"]) if w["dest_map"]==inner["id"]]
            assert indexes,(name,"unreachable")
            assert len(inner["warp_events"])>=1,(name,"no exit")
            assert all(w["dest_map"]==outside["id"] and int(w["dest_warp_id"])==indexes[0]
                       for w in inner["warp_events"]),(name,"bad return warp")
            scripts=(Path("data/maps")/name/"scripts.inc").read_text()
            if name.endswith("_Mart"):
              assert "pokemart " in scripts
            else:
              assert "Common_EventScript_PkmnCenterNurse" in scripts
          scripts=Path("data/maps/Kanto_VermilionCity/scripts.inc").read_text()
          assert "special Kanto_ReturnToHoennHealWarp" in scripts
          assert "special HealPlayerParty" in scripts
          assert "setwildbattle SPECIES_PIDGEY, 5, ITEM_NONE" in scripts
          assert "dowildbattle" in scripts
          PY
      - name: Get SDL2 Windows runtime and compile game with authentic maps
        run: |
          set -euxo pipefail
          mkdir -p .deps
          curl -fL --retry 3 https://www.libsdl.org/release/SDL2-devel-2.30.7-mingw.tar.gz -o .deps/SDL2-devel-2.30.7-mingw.tar.gz
          tar -xzf .deps/SDL2-devel-2.30.7-mingw.tar.gz -C .deps
          make -f Makefile_pc -j2 SDL_DIR="$PWD/.deps/SDL2-2.30.7/i686-w64-mingw32"
          test -s pokeemerald.exe
          file pokeemerald.exe
      - name: Label provisional nature and source revision
        run: |
          printf 'Kanto V0.3: 38 FRLG outdoor maps, 17 functional service interiors, original wild encounter data.\nQA inside actual gameplay, regional respawn, original stories/gyms, and LAN remain incomplete.\nSOURCE_COMMIT=%s\nFIRERED_SOURCE=ce6406d8c2eaf46d543c8a2606de0c3cb1951982\n' "$GITHUB_SHA" > KANTO_V03_STATUS.txt
          sha256sum pokeemerald.exe > KANTO_V03_SHA256.txt
          cp .deps/SDL2-2.30.7/i686-w64-mingw32/bin/SDL2.dll .
      - uses: actions/upload-artifact@v4
        with:
          name: KANTO_V03_KANTO_SERVICES_UNTESTED_WINDOWS
          path: |
            pokeemerald.exe
            SDL2.dll
            kanto-exteriors-import.json
            KANTO_V02_STATUS.txt
            KANTO_V02_SHA256.txt
          if-no-files-found: error
          retention-days: 30
