name: Grand World GBA - Residual Species Trade Leads
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-trade-species-leads.yml'
      - 'tools/grandworld/audit_grass_trade_leads.py'
      - 'tools/grandworld/tests/test_audit_grass_trade_leads.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  only_new_trade_leads:
    name: Inspect World trade offers for 12 unresolved species
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated species audit
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned World source
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
      - name: Test just new trade-source invariants
        run: |
          set -euo pipefail
          python3 -m unittest discover -s grandworld/tools/grandworld/tests -p test_audit_grass_trade_leads.py -v
      - name: Compose same pinned M8 source data for accurate land availability
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
      - name: Audit explicit in-game trade offers and request species
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/audit_grass_trade_leads.py \
            --wild-table world/src/data/wild_encounters.json \
            --trade-header world/src/data/trade.h \
            --output residual-trade-source-leads.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('residual-trade-source-leads.json').read_text())
          assert r['trade_entries_parsed']>=8
          assert len(r['target_12_species'])==12
          assert r['trade_lead_species']==1
          assert r['leads'][0]['offers']=='SPECIES_HORSEA'
          assert r['leads'][0]['requires']=='SPECIES_BAGON'
          assert r['leads'][0]['requested_species_in_original_land_table']
          assert not r['source_scans_can_prove_obtainability']
          assert not r['rom_modified'] and not r['saves_modified']
          print('SOURCE ONLY: Horsea trade offered for Bagon (land table), not a certified completed trade')
          PY
      - name: Upload only proof, no ROM or saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_ORIGINAL_TRADE_SOURCE_HORSEA_LEAD
          if-no-files-found: warn
          path: residual-trade-source-leads.json
