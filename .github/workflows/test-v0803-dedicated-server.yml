name: Emerald Hybrid v0.8.3 Dedicated EHL8 Session Server
on:
  push:
    branches:
      - feature/lan-v0803-dedicated-session-core
    paths:
      - 'tools/emerald_session_server.py'
      - 'tests/test_emerald_session_server.py'
      - '.github/workflows/package-v0803-ehl8-preview.yml' # rebuild components for packaging-only fixes
      - 'src/platform/sdl2.c' # same-commit server artifact for preview packaging
      - 'src/lnet/lnet_session_client.*'
      - 'tests/native_ehl8_client.c'
      - 'tests/test_ehl8_native_bridge.py'
      - '.github/workflows/test-v0803-dedicated-server.yml'
  pull_request:
    paths:
      - 'tools/emerald_session_server.py'
      - 'tests/test_emerald_session_server.py'
      - 'src/lnet/lnet_session_client.*'
      - 'tests/native_ehl8_client.c'
      - 'tests/test_ehl8_native_bridge.py'
      - '.github/workflows/test-v0803-dedicated-server.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  socket-tests:
    name: Real TCP loopback / framing / lobby tests
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and real socket integration tests
        run: |
          python -m py_compile tools/emerald_session_server.py
          python -m unittest discover -s tests -p test_emerald_session_server.py -v
      - name: Build separate Windows headless session-server executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name EmeraldSessionServer tools/emerald_session_server.py
          if (!(Test-Path dist/EmeraldSessionServer.exe)) { throw "Dedicated session server executable missing" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Emerald-v0803-EHL8-SessionServer-Windows-DEV-NOT-GAMEPLAY
          path: dist/EmeraldSessionServer.exe
          retention-days: 14
          if-no-files-found: error

  native-client-bridge:
    name: Native C SessionClient ↔ EHL8 server (real TCP)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile C SessionClient and exercise native 2-player EHL8 session
        run: python -m unittest discover -s tests -p test_ehl8_native_bridge.py -v
