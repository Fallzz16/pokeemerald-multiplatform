name: Grand World GBA - Real Proposed Species Encounter PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-candidate-natural-spawn.yml'
      - 'qa/gba/GrandWorldCandidateQwilfish.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-candidate-natural-spawn-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real_intro:
    name: Real natural Qwilfish candidate encounter in grass on experimental GBA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned original World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM toolchain and mGBA dependencies (bounded, fail closed)
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo 'APT update: bounded to 360s (prior runner stalled before game tests)'
          timeout --signal=TERM --kill-after=15s 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          echo 'APT installation: bounded to 1440s due to intermittent slow ARM compiler mirror; no interactive prompts'
          timeout --signal=TERM --kill-after=15s 1440s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          command -v arm-none-eabi-gcc
          luac5.4 -p grandworld/qa/gba/GrandWorldCandidateQwilfish.lua
      - name: Compose pinned GBA M8 and PT-BR without changing the source engine
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report candidate-spawn-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report candidate-spawn-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report candidate-spawn-translation.json
          # Only experimental M9 map-table changes are applied to this one disposable checkout.
          python3 grandworld/tools/grandworld/propose_grass_species_recovery.py \
            world/src/data/wild_encounters.json --maps-dir world/data/maps \
            --grass-evidence grandworld/qa/gba/verified_grass_tiles_20261026.json \
            --report candidate-spawn-plan.json \
            --experimental-output /tmp/world_candidate_spawn_wild.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('candidate-spawn-plan.json').read_text())
          q=[x for x in d['proposals'] if x['species']=='SPECIES_QWILFISH']
          assert len(q)==1 and q[0]['map']=='MAP_ROUTE32', 'candidate proposal changed; stop before ROM build'
          assert d['real_emulator_grass_gate_applied'] and not d['release_approved']
          print('Testing one real candidate:',q[0])
          PY
          cp /tmp/world_candidate_spawn_wild.json world/src/data/wild_encounters.json
          cp grandworld/qa/gba/GrandWorldCandidateQwilfish.lua world/test/overworld/lua/
          # Add two test-only link symbols to the generated ROM-bound Lua symbol table.
          # This modifies only a throwaway World checkout; the game code is untouched.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('world/test/overworld/GenLuaSymbols.py')
          s=p.read_text()
          old='    "gBattleTypeFlags", "gBattlersCount", "gBattleOutcome",'
          new='    "gBattlerControllerFuncs",\n'+old
          assert s.count(old)==1, 'World Lua symbol anchor changed'
          p.write_text(s.replace(old,new))
          PY
          git -C world diff --check
      - name: Build ONLY experimental PT-BR candidate cartridge
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 > candidate-spawn-build.log 2>&1
          test -s world/pokemonworld.gba
      - name: Build known pinned headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Resolve exact candidate and real ROM battle symbols from generated ELF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          groups=json.loads(Path('world/data/maps/map_groups.json').read_text())
          entries=[(g,groups[name].index('Route32')) for g,name in enumerate(groups['group_order'])
                   if 'Route32' in groups[name]]
          assert len(entries)==1,entries
          group,mapid=entries[0]
          plan=json.loads(Path('candidate-spawn-plan.json').read_text())
          q=[x for x in plan['proposals'] if x['species']=='SPECIES_QWILFISH' and x['map']=='MAP_ROUTE32']
          assert len(q)==1
          sp=Path('world/include/constants/species.h').read_text()
          mt=re.search(r'\bSPECIES_QWILFISH\s*=\s*(\d+)',sp)
          assert mt,'no Qwilfish constant in exact World ROM source'
          species=int(mt.group(1))
          out=subprocess.run(['arm-none-eabi-nm','-S','--defined-only','world/pokemonworld.elf'],
                             text=True,check=True,capture_output=True).stdout
          callbacks=set()
          stride=None
          for line in out.splitlines():
              p=line.split()
              if len(p)!=4: continue
              addr,size,kind,name=p
              if name=='HandleChooseActionAfterDma3':
                  v=int(addr,16)
                  assert 0x08000000<=v<0x0A000000
                  callbacks.add(v)
              elif name=='gBattleMons':
                  n=int(size,16)
                  assert n%4==0 and 40<=n//4<=300,(n,size)
                  stride=n//4
          assert 2<=len(callbacks)<=8,callbacks
          assert stride is not None
          path=Path('world/test/overworld/lua/candidate_battle_rom_symbols.lua')
          path.write_text(
              'return {group='+str(group)+',map='+str(mapid)+','
              +'expected_species='+str(species)+',battle_mon_stride='+str(stride)
              +',action_callbacks={'+','.join(hex(x) for x in sorted(callbacks))+'}}\n')
          print('Actual battle ROM:',dict(group=group,map=mapid,species=species,
                                          battle_mons_stride=stride,callback_count=len(callbacks)))
          PY
          luac5.4 -p world/test/overworld/lua/candidate_battle_rom_symbols.lua
      - name: Walk and observe new Qwilfish through native wild RNG and RUN
        shell: bash
        timeout-minutes: 28
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/candidate-spawn-evidence/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          rm -f "$PW_OUT/GrandWorldCandidateQwilfish.PASS" "$PW_OUT/GrandWorldCandidateQwilfish.FAIL"
          PW_TIMEOUT=990 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldCandidateQwilfish.lua "$PWD/pokemonworld.gba" \
            | tee "$PW_OUT/GrandWorldCandidateQwilfish.stdout.log"
          test -s "$PW_OUT/GrandWorldCandidateQwilfish.PASS"
          test ! -e "$PW_OUT/GrandWorldCandidateQwilfish.FAIL"
          grep -Eq "^PASS 10/10 rom=$md5 .* suite=GrandWorldCandidateQwilfish$" "$PW_OUT/GrandWorldCandidateQwilfish.PASS"
      - name: Guard evidence wording; one candidate is NOT species wide approval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          result={'rom_sha256':hashlib.sha256(rom).hexdigest(),
                  'target':'GBA PT-BR ARM experimental M9 candidate only',
                  'species_tested':'SPECIES_QWILFISH',
                  'tested_in':'MAP_ROUTE32',
                  'encounter_origin':'REAL grass footsteps and unmodified RNG',
                  'natural_candidate_spawn_observed':True,
                  'release_approved':False,
                  'all_candidate_species_verified':False,
                  'habitat_plausibility_approved':False,
                  'save_compatibility_of_candidate_world_verified':False}
          Path('candidate-spawn-evidence/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Keep only QA logs, screenshots, hashes and patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_EXPERIMENTAL_NATURAL_SPECIES_QA
          if-no-files-found: warn
          path: |
            candidate-spawn-evidence/
            intro-translation.json
            intro-gba-build.log
            intro-shadow.json
            intro-grass.json
