name: Grand World M8 - Three-Region GBA Build Baseline
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-m8-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-gba-baseline:
    name: World GBA build and region validators
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout pinned Pokemon World (separate from Hybrid)
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          path: world
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real GBA toolchain and native converters
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev libelf1
      - name: Record pinned source and tools
        run: |
          git -C world rev-parse HEAD | tee world-source-sha.txt
          arm-none-eabi-gcc --version | head -1 | tee toolchain.txt
          test "$(git -C world rev-parse HEAD)" = 15d3888b0d81322a04d3c71b0bce18948761ee44
      - name: Compile actual 3-region Game Boy Advance ROM
        shell: bash
        run: |
          set -o pipefail
          make -C world modern -j2 2>&1 | tee build.log
          test -s world/pokemonworld.gba
      - name: Validate 15 upstream region/asset checks
        shell: bash
        run: |
          set -o pipefail
          make -C world validate 2>&1 | tee validate.log
      - name: Validate inherited battle-engine suite
        shell: bash
        run: |
          set -o pipefail
          make -C world check -j2 2>&1 | tee check.log
      - name: Verify ROM identity and produce source-bound evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          p=Path('world/pokemonworld.gba')
          rom=p.read_bytes()
          assert len(rom)==33554432, len(rom)
          assert rom[0xb2]==0x96, 'GBA fixed byte absent'
          assert rom[0xac:0xb0]==b'BPEE', 'Unexpected game code'
          assert (sum(rom[0xa0:0xbd])+0x19+rom[0xbd])&255==0, 'GBA header checksum incorrect'
          body={'source_sha':Path('world-source-sha.txt').read_text().strip(),
                'rom_sha256':hashlib.sha256(rom).hexdigest(),
                'rom_size':len(rom),'game_code':rom[0xac:0xb0].decode(),
                'checked': ['32MiB','fixed-byte','game-code','complement-checksum'],
                'gameplay_playthrough_verified':False}
          Path('grandworld-world-gba-evidence.json').write_text(json.dumps(body,indent=2))
          print(json.dumps(body,indent=2))
          PY
      - name: Checkout isolated Grand World M8 integration adapters
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Patch real World trainer factory and travel gates
        run: |
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 -m py_compile grandworld/tools/grandworld/integrate_world.py
      - name: Compile modified world ROM with M2 and M4 runtime integration
        shell: bash
        run: |
          set -o pipefail
          make -C world tidy
          make -C world modern -j2 2>&1 | tee patched-build.log
          test -s world/pokemonworld.gba
      - name: Recheck real map scripts and battle engine after patch
        shell: bash
        run: |
          set -o pipefail
          make -C world validate 2>&1 | tee patched-validate.log
          make -C world check -j2 2>&1 | tee patched-check.log
      - name: Compare source-pinned real ROMs without shipping copyrighted binaries
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          baseline=json.loads(Path('grandworld-world-gba-evidence.json').read_text())
          rom=Path('world/pokemonworld.gba').read_bytes()
          assert len(rom)==33554432, len(rom)
          assert rom[0xac:0xb0]==b'BPEE'
          assert (sum(rom[0xa0:0xbd])+0x19+rom[0xbd])&255==0
          patched=hashlib.sha256(rom).hexdigest()
          assert patched!=baseline['rom_sha256'], 'M8 patch had no effect on output'
          evidence={'source_sha':baseline['source_sha'],
                    'baseline_sha256':baseline['rom_sha256'],
                    'patched_sha256':patched,
                    'rom_size':len(rom),
                    'battle_and_region_source_integrated':True,
                    'continuous_playthrough_verified':False,
                    'full_save_reload_verified':False}
          Path('grandworld-m8-patched-evidence.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence,indent=2))
          PY
      - name: Upload logs and hashes, never commercial assets or ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRANDWORLD_M8_WORLD_GBA_BASELINE_LOGS
          path: |
            build.log
            validate.log
            check.log
            patched-build.log
            patched-validate.log
            patched-check.log
            grandworld-m8-patched-evidence.json
            toolchain.txt
            world-source-sha.txt
            grandworld-world-gba-evidence.json
          if-no-files-found: warn
