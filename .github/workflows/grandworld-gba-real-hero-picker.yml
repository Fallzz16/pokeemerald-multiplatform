name: Grand World GBA - Real Six Hero Picker PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-real-hero-picker.yml'
      - 'qa/gba/GrandWorldHeroPicker.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-picker-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real_intro:
    name: Six actual intro UI selections on fresh PT-BR GBA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned original World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM toolchain and mGBA dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          luac5.4 -p grandworld/qa/gba/GrandWorldHeroPicker.lua
      - name: Compose pinned GBA M8 and PT-BR without changing the source engine
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report intro-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report intro-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report intro-translation.json
          cp grandworld/qa/gba/GrandWorldHeroPicker.lua world/test/overworld/lua/
          git -C world diff --check
      - name: Build a real PT-BR cartridge needed by this new test
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 > intro-gba-build.log 2>&1
          test -s world/pokemonworld.gba
      - name: Build known pinned headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Test the actual six protagonist menus without staged RAM
        shell: bash
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/intro-picker-proofs/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          heroes=(Brendan May Red Leaf Ethan Lyra)
          for slot in 0 1 2 3 4 5; do
            name="GrandWorldPicker${heroes[$slot]}"
            export GW_HERO_SLOT="$slot"
            rm -f "$PW_OUT/$name.PASS" "$PW_OUT/$name.FAIL"
            PW_TIMEOUT=480 test/overworld/mgba-run.sh test/overworld/lua/GrandWorldHeroPicker.lua "$PWD/pokemonworld.gba" | tee "$PW_OUT/$name.stdout.log"
            test -s "$PW_OUT/$name.PASS"
            test ! -e "$PW_OUT/$name.FAIL"
            grep -Eq "^PASS 16/16 rom=$md5 .* suite=$name$" "$PW_OUT/$name.PASS"
          done
      - name: Record only ROM-bound proof, not the ROM or save files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          base=Path('intro-picker-proofs')
          rom=Path('world/pokemonworld.gba').read_bytes()
          md5=hashlib.md5(rom).hexdigest().upper()
          names=['Brendan','May','Red','Leaf','Ethan','Lyra']
          for name in names:
              path=base/f'GrandWorldPicker{name}.PASS'
              verdict=path.read_text(encoding='utf-8')
              assert re.fullmatch(rf'PASS 16/16 rom={md5} at=[^\r\n]+ suite=GrandWorldPicker{name}\s*',verdict)
              assert not (base/f'GrandWorldPicker{name}.FAIL').exists()
          proof={'rom_sha256':hashlib.sha256(rom).hexdigest(),'target':'GBA PT-BR',
                 'real_intro_picker_suites':names,'total_assertions':96,
                 'staged_save_identity':False,'manual_art_certified':False,
                 'all_region_campaigns_certified':False,'release_approved':False}
          (base/'result.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Keep only QA logs, screenshots, hashes and patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_REAL_HERO_PICKER_EVIDENCE
          if-no-files-found: warn
          path: |
            intro-picker-proofs/
            intro-translation.json
            intro-gba-build.log
            intro-shadow.json
            intro-grass.json
