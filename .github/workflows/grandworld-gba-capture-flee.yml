name: Grand World GBA - Real Catch and Flee PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-capture-flee.yml'
      - 'qa/gba/GrandWorldWildBattleCycle.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-capture-flee-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real_intro:
    name: Actual wild capture and flee in disposable PT-BR GBA sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout pinned original World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM toolchain and mGBA dependencies (bounded, fail closed)
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo 'APT update: bounded to 360s (prior runner stalled before game tests)'
          timeout --signal=TERM --kill-after=15s 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          echo 'APT installation: bounded to 420s, no interactive prompts'
          timeout --signal=TERM --kill-after=15s 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          command -v arm-none-eabi-gcc
          luac5.4 -p grandworld/qa/gba/GrandWorldWildBattleCycle.lua
      - name: Compose pinned GBA M8 and PT-BR without changing the source engine
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report intro-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report intro-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report intro-translation.json
          cp grandworld/qa/gba/GrandWorldWildBattleCycle.lua world/test/overworld/lua/
          # Add two test-only link symbols to the generated ROM-bound Lua symbol table.
          # This modifies only a throwaway World checkout; the game code is untouched.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('world/test/overworld/GenLuaSymbols.py')
          s=p.read_text()
          old='    "gBattleTypeFlags", "gBattlersCount", "gBattleOutcome",'
          new='    "gBattlerControllerFuncs",\n'+old
          assert s.count(old)==1, 'World Lua symbol anchor changed'
          p.write_text(s.replace(old,new))
          PY
          git -C world diff --check
      - name: Build PT-BR GBA cartridge for focused wild battle QA
        shell: bash
        run: |
          set -euo pipefail
          make -C world modern -j2 > intro-gba-build.log 2>&1
          test -s world/pokemonworld.gba
      - name: Resolve every duplicated battle action callback from this exact ELF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          proc=subprocess.run(['arm-none-eabi-nm','-S','world/pokemonworld.elf'],
                              text=True,capture_output=True,check=True)
          addresses=set()
          for line in proc.stdout.splitlines():
              items=line.split()
              if len(items)==4 and items[-1]=='HandleChooseActionAfterDma3':
                  v=int(items[0],16)
                  assert 0x08000000<=v<0x0A000000,hex(v)
                  addresses.add(v)
          assert 2<=len(addresses)<=8, 'expected distinct player/battle action callbacks'
          target=Path('world/test/overworld/lua/battle_action_callbacks.lua')
          target.write_text('return {'+', '.join(f'0x{x:08x}' for x in sorted(addresses))+'}\n')
          print('battle controller callbacks: '+', '.join(hex(x) for x in sorted(addresses)))
          PY
      - name: Build known pinned headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Execute RUN and CAPTURE using real emulator joypad and live bag UI
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/wild-cycle-proofs/"
          mkdir -p "$PW_OUT"
          for mode in FLEE CAPTURE; do
            export GW_CYCLE_MODE="$mode"
            if [ "$mode" = FLEE ]; then name=GrandWorldWildFlee; else name=GrandWorldWildCapture; fi
            rm -f "$PW_OUT/$name.PASS" "$PW_OUT/$name.FAIL"
            PW_TIMEOUT=680 test/overworld/mgba-run.sh \
              test/overworld/lua/GrandWorldWildBattleCycle.lua "$PWD/pokemonworld.gba" \
              | tee "$PW_OUT/$name.stdout.log"
            test -s "$PW_OUT/$name.PASS"
            test ! -e "$PW_OUT/$name.FAIL"
          done
      - name: Validate each result is real, complete and bound to this ROM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          rom=Path('world/pokemonworld.gba').read_bytes()
          md5=hashlib.md5(rom).hexdigest().upper()
          checks={}
          for name in ('GrandWorldWildFlee','GrandWorldWildCapture'):
              p=Path('wild-cycle-proofs')/f'{name}.PASS'
              data=p.read_text(encoding='utf-8')
              m=re.fullmatch(rf'PASS (\d+)/(\d+) rom={md5} at=[^\r\n]+ suite={name}\s*',data)
              assert m, f'{name} not ROM-bound or failed'
              passed,total=map(int,m.groups())
              assert passed==total and total>=10, (name,passed,total)
              assert not (p.parent/f'{name}.FAIL').exists()
              checks[name]=total
          result={'target':'real PT-BR ARM GBA','rom_sha256':hashlib.sha256(rom).hexdigest(),
                  'passed_real_battle_tests':checks,
                  'game_ram_force_battle':False,
                  'native_bag_and_run_input':True,
                  'other_areas_and_species_certified':False,
                  'hardware_certified':False,'release_approved':False}
          Path('wild-cycle-proofs/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Keep only QA logs, screenshots, hashes and patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_WILD_FLEE_AND_CAPTURE_EVIDENCE
          if-no-files-found: warn
          path: |
            wild-cycle-proofs/
            intro-translation.json
            intro-gba-build.log
            intro-shadow.json
            intro-grass.json
