name: Emerald Hybrid LAN candidate Windows x86

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/lan-v0803-dedicated-session-core
      - feature/lan-v080-mega-desktop-polish
      - feature/lan-v080-desktop-graphical-launcher
      - feature/lan-v080-architecture-spec
      - feature/lan-v080-m0-m1-foundation
      - feature/lan-v070-async-slot-hardening
      - feature/lan-v071-connection-stability
      - feature/lan-v072-overworld-presence
  push:
    branches:
      - feature/lan-v0804-reconnect-60s
      - feature/lan-v0803-dedicated-session-core
      - feature/lan-v080-mega-desktop-polish
      - feature/lan-v080-m0-m1-foundation
      - feature/lan-hybrid-v070
      - feature/lan-v070-async-slot-hardening
      - feature/lan-v071-connection-stability
      - feature/lan-v072-overworld-presence
      - feature/lan-v0721-viewport-culling
    paths-ignore:
      - '**/*.md'

jobs:
  windows-x86:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact candidate source and its ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # v0.7.0 verifier needs the actual bced8c64 v0.3.4 ancestor.

      - name: Install build and MinGW dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-mingw-w64-i686 \
            binutils-mingw-w64-i686 \
            libpng-dev \
            zlib1g-dev \
            curl \
            ca-certificates \
            file

      - name: Set up Python for sprite QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image-test dependency
        run: python -m pip install Pillow

      - name: Verify LAN transport on Linux (real host/client TCP)
        run: bash scripts/verify_lan_foundation.sh

      - name: Verify all candidate mechanics and the sprite import pipeline
        run: EMERALD_LAN_QA=1 EMERALD_V080_QA=1 bash scripts/verify_v070.sh

      - name: Download SDL2 MinGW development headers and DLL
        shell: bash
        run: |
          set -euxo pipefail
          SDL_VERSION=2.30.7
          mkdir -p .deps
          curl -fL --retry 3 \
            "https://www.libsdl.org/release/SDL2-devel-${SDL_VERSION}-mingw.tar.gz" \
            -o ".deps/SDL2-devel-${SDL_VERSION}-mingw.tar.gz"
          tar -xzf ".deps/SDL2-devel-${SDL_VERSION}-mingw.tar.gz" -C .deps
          test -f ".deps/SDL2-${SDL_VERSION}/i686-w64-mingw32/include/SDL2/SDL.h"
          test -f ".deps/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll"

      - name: Build SDL2 native port with LAN link and Hybrid battles
        shell: bash
        run: |
          set -euxo pipefail
          SDL_VERSION=2.30.7
          make -f Makefile_pc -j2 \
            SDL_DIR="$PWD/.deps/SDL2-${SDL_VERSION}/i686-w64-mingw32"
          file pokeemerald.exe

      - name: Assemble test candidate (not a stable release)
        shell: bash
        run: |
          set -euxo pipefail
          SDL_VERSION=2.30.7
          mkdir -p dist/Emerald-Hybrid-v0.7.2.1-ViewportCulling
          cp pokeemerald.exe dist/Emerald-Hybrid-v0.7.2.1-ViewportCulling/
          cp ".deps/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll" dist/Emerald-Hybrid-v0.7.2.1-ViewportCulling/
          cp LAN_HOST.bat LAN_JOIN.bat dist/Emerald-Hybrid-v0.7.2.1-ViewportCulling/
          cat > dist/Emerald-Hybrid-v0.7.2.1-ViewportCulling/README.txt <<'EOF'
          Emerald Vanilla+ Hybrid v0.7.2.1 — experimental LAN Windows x86 viewport-culling candidate
          BASE: emerald-vanilla-plus at bced8c64a5a043438858165b55405906ebdd5301

          Battles: Fairy and Physical/Special/Status split from v0.5.0, plus optional team EXP and battle-text speed.
          QoL: TM reuse, running indoors, Link Cable, modern EXP, Repel reuse, Nature and Dex typing.
          Sprite Bridge: optional safe donor importer; no new Gen4 species or donor sprites bundled.
          The game sprites remain Emerald originals until the user imports donor PNGs explicitly.
          Original fast-forward (Tab/F6), Quest UI, audio and save format retained.
          LAN TEST (EXPERIMENTAL):
          Both PCs must use the exact same candidate build.
          On host: run LAN_HOST.bat. On peer: run LAN_JOIN.bat and type host LAN IPv4.
          Allow Windows Firewall inbound TCP 45680 on the host when requested.
          Use the original in-game Cable Club to start a link trade or battle.
          OVERWORLD: remote trainers can appear in the same map using TCP port 45681.
          Their sprites are culled when outside the local 240x160 camera.
          The two-player world view remains experimental and needs in-game QA.
          If connection fails, use a LAN log and report the error; this release has
          NOT yet passed a complete two-player real-gameplay test.
          Android ARMv7 remains experimental and may not work on 64-bit-only phones.

          Test with a copy of your pokeemerald.sav. Do not overwrite your only save.
          Full game/runtime QA and save round-trip still required before calling stable.
          EOF

      - name: Upload experimental LAN candidate
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Hybrid-LAN-v0.7.2.1-ViewportCulling-Windows-x86
          path: dist/Emerald-Hybrid-v0.7.2.1-ViewportCulling/
          if-no-files-found: error

