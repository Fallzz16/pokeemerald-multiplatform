name: Grand World GBA - Original Silph Co Lapras Gift PT-BR
on:
  pull_request:
    paths:
      - '.github/workflows/grandworld-gba-silph-lapras-gift.yml'
      - 'qa/gba/GrandWorldSilphLaprasGift.lua'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grandworld-silph-lapras-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  lapras_gift:
    name: Receive real scripted Lapras gift via GBA joypad
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Grand World changes
        uses: actions/checkout@v4
        with:
          path: grandworld
      - name: Checkout exact pinned World engine
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          ref: 15d3888b0d81322a04d3c71b0bce18948761ee44
          fetch-depth: 0
          path: world
      - name: Install ARM and emulator build dependencies (bounded)
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 360s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=25
          timeout --signal=TERM --kill-after=15s 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev cmake liblua5.4-dev lua5.4
          command -v arm-none-eabi-gcc
          luac5.4 -p grandworld/qa/gba/GrandWorldSilphLaprasGift.lua
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          w=Path('world')
          groups=json.loads((w/'data/maps/map_groups.json').read_text())
          coords=[(g,groups[name].index('SilphCo_7F_Frlg'))
                  for g,name in enumerate(groups['group_order'])
                  if 'SilphCo_7F_Frlg' in groups[name]]
          assert coords==[(35,53)],coords
          mp=json.loads((w/'data/maps/SilphCo_7F_Frlg/map.json').read_text())
          assert mp['id']=='MAP_SILPH_CO_7F',mp['id']
          assert any(e['x']==0 and e['y']==7 and e['script']=='SilphCo_7F_EventScript_LaprasGuy'
                     and e['flag']=='0' for e in mp['object_events'])
          assert mp['warp_events'][1]['x']==5 and mp['warp_events'][1]['y']==8
          s=(w/'data/maps/SilphCo_7F_Frlg/scripts.inc').read_text()
          assert 'SilphCo_7F_EventScript_LaprasGuy::' in s
          assert 'givemon SPECIES_LAPRAS, 25' in s
          assert 'setflag FLAG_GOT_LAPRAS_FROM_SILPH' in s
          flag=(w/'include/constants/flags.h').read_text()
          assert re.search(r'#define FLAG_GOT_LAPRAS_FROM_SILPH\s+\(0xA40 \+ 0x246\)',flag)
          species=(w/'include/constants/species.h').read_text()
          assert 'SPECIES_LAPRAS = 131' in species
          assert 'sSubstructOffsets[4][24]' in (w/'src/pokemon.c').read_text()
          print('Pinned original Silph gift/flag/warp/BoxPokemon source verified')
          PY
      - name: Compose only pinned M8 and ASCII PT-BR into throwaway World checkout
        run: |
          set -euo pipefail
          python3 grandworld/tools/grandworld/integrate_world.py world
          python3 grandworld/tools/grandworld/expand_gen4_pilot.py world --apply --with-gen5-trial
          python3 grandworld/tools/grandworld/add_hero_profiles.py world
          python3 grandworld/tools/grandworld/add_kanto_avatar.py world
          python3 grandworld/tools/grandworld/optimize_overworld_budget.py world --apply --shadows lean --report silph-gift-shadow.json
          python3 grandworld/tools/grandworld/apply_grass_only.py world --apply --report silph-gift-grass.json
          python3 grandworld/tools/grandworld/translate_ptbr_stage1.py world --apply --report silph-gift-translation.json
          cp grandworld/qa/gba/GrandWorldSilphLaprasGift.lua world/test/overworld/lua/
          git -C world diff --check
      - name: Build real ARM GBA cartridge for new gift-only acceptance
        run: |
          set -euo pipefail
          make -C world modern -j2 > silph-gift-build.log 2>&1
          test -s world/pokemonworld.gba
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          assert rom[0xAC:0xB0]==b'BPEE',rom[0xAC:0xB0]
          assert len(rom)<=32*1024*1024,len(rom)
          print('Real GBA ARM BPEE cartridge size',len(rom))
          PY
      - name: Build pinned known-working headless mGBA
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba
          git -C mgba checkout 669817d03e4858e65d0b992bcd96d3009236cc1e
          git -C mgba apply ../world/test/overworld/mgba/0001-headless-video-buffer-save-and-rtc.patch
          cmake -S mgba -B mgba/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_HEADLESS=ON -DENABLE_SCRIPTING=ON -DUSE_LUA=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DUSE_FFMPEG=OFF -DUSE_DISCORD_RPC=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          cmake --build mgba/build -j2 --target mgba-headless
      - name: Walk to original worker and receive actual Lapras in mGBA
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd world
          export MGBA_HEADLESS="$GITHUB_WORKSPACE/mgba/build/mgba-headless"
          export PW_OUT="$GITHUB_WORKSPACE/silph-lapras-gift-proofs/"
          mkdir -p "$PW_OUT"
          md5=$(md5sum pokemonworld.gba | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          rm -f "$PW_OUT/GrandWorldSilphLaprasGift.PASS" "$PW_OUT/GrandWorldSilphLaprasGift.FAIL"
          PW_TIMEOUT=600 test/overworld/mgba-run.sh \
            test/overworld/lua/GrandWorldSilphLaprasGift.lua "$PWD/pokemonworld.gba" \
            | tee "$PW_OUT/GrandWorldSilphLaprasGift.stdout.log"
          test -s "$PW_OUT/GrandWorldSilphLaprasGift.PASS"
          test ! -e "$PW_OUT/GrandWorldSilphLaprasGift.FAIL"
          grep -Eq "^PASS 12/12 rom=$md5 .* suite=GrandWorldSilphLaprasGift$" "$PW_OUT/GrandWorldSilphLaprasGift.PASS"
      - name: Record evidence only after exact ROM-bound 12/12
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          rom=Path('world/pokemonworld.gba').read_bytes()
          base=Path('silph-lapras-gift-proofs')
          md5=hashlib.md5(rom).hexdigest().upper()
          p=(base/'GrandWorldSilphLaprasGift.PASS').read_text()
          assert re.fullmatch(rf'PASS 12/12 rom={md5} at=[^\r\n]+ suite=GrandWorldSilphLaprasGift\s*',p)
          assert not (base/'GrandWorldSilphLaprasGift.FAIL').exists()
          proof={'platform':'GBA ARM in pinned mGBA','rom_sha256':hashlib.sha256(rom).hexdigest(),
                 'original_script':'SilphCo_7F_EventScript_LaprasGuy',
                 'live_lapras_gift_received_in_party':True,'checks':12,
                 'debug_warp_used_as_test_setup':True,
                 'campaign_reachability_verified':False,
                 'original_m8_modified':False,'release_approved':False}
          (base/'result.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Upload logs, hashes, JSON and screenshots (never ROM or save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PTBR_SILPH_LAPRAS_GIFT_EVIDENCE
          if-no-files-found: warn
          path: |
            silph-lapras-gift-proofs/
            silph-gift-translation.json
            silph-gift-shadow.json
            silph-gift-grass.json
            silph-gift-build.log
